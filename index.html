function MapView({listings}){

// ── IG SCRAPER ───────────────────────────────────────────────────────
async function fetchApifyDataset(datasetId, apiKey) {
  const url = `https://api.apify.com/v2/datasets/${datasetId}/items?format=json&clean=true&token=${apiKey}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Apify error: ${res.status}`);
  const data = await res.json();
  const all = data.filter(item => !item.error && item.caption);
  return { total: all.length, filtered: preFilter(all) };
}


// ── FILTRI TARGET ─────────────────────────────────────────────────
const KEYWORDS_STOP = ["affitto","in affitto","locazione","affittasi","si affitta","appartamento in affitto"];
const KEYWORDS_OK   = ["bilocale","trilocale","tre locali","due locali","2 locali","3 locali","vendo","vendita","proponiamo in vendita","cedesi"];

function preFilter(items) {
  return items.filter(item => {
    if (!item.caption) return false;
    const cap = item.caption.toLowerCase();
    if (KEYWORDS_STOP.some(k => cap.includes(k))) return false;
    if (!KEYWORDS_OK.some(k => cap.includes(k))) return false;
    return true;
  });
}

function postFilter(info) {
  if (!info) return false;
  if (info.operazione === "affitto") return false;
  if (info.tipo === "monolocale" || info.tipo === "quadrilocale") return false;
  if (info.dimensione && Number(info.dimensione) < 70) return false;
  if (info.prezzo && Number(info.prezzo) > 520000) return false;
  return true;
}

function parseCaption(caption) {
  const c = caption || "";
  const cl = c.toLowerCase();

  let tipo = "altro";
  if (/monolocale|mono locale|1 locale|1 vano/i.test(c)) tipo = "monolocale";
  else if (/bilocale|bi locale|due locali|2 locali|2 vani/i.test(c)) tipo = "bilocale";
  else if (/trilocale|tri locale|tre locali|3 locali|3 vani/i.test(c)) tipo = "trilocale";
  else if (/quadrilocale|quattro locali|4 locali|4 vani/i.test(c)) tipo = "quadrilocale";

  let operazione = "vendita";
  if (/affitto|affittasi|locazione|rent/i.test(c)) operazione = "affitto";

  let prezzo = null;
  const pm1 = c.match(/[€]\s*(\d[\d\s.,']*\d)/);
  const pm2 = c.match(/(\d[\d\s.,']*\d)\s*[€]/);
  const pm3 = c.match(/(\d{2,3})\s*k/i);
  for (const m of [pm1, pm2]) {
    if (m) {
      const n = parseInt(m[1].replace(/[\s.,]/g,""));
      if (n > 30000 && n < 5000000) { prezzo = n; break; }
    }
  }
  if (!prezzo && pm3) { prezzo = parseInt(pm3[1]) * 1000; }

  let dimensione = null;
  const mm = c.match(/(\d{2,3})\s*(?:mq|m2|m²|metri)/i);
  if (mm) dimensione = parseInt(mm[1]);

  let piano = null;
  const pm = c.match(/(\d+)[°º]?\s*piano|piano\s*(terra|rialzato)/i);
  if (pm) piano = pm[0].slice(0,25);

  let condizioni = "Buono";
  if (/ristrutturato|ottimo stato|nuovo|appena ristrutturato/i.test(c)) condizioni = "Ottimo";
  else if (/da ristrutturare|da rinnovare|richiede lavori/i.test(c)) condizioni = "Da ristrutturare";

  const terrazzo = /terrazzo|terrazza|balcone/i.test(c);
  const box = /garage|posto auto|autorimessa/i.test(c) || /box/i.test(c);
  const cantina = /cantina|ripostiglio/i.test(c);

  const zoneMap = [
    {k:["città studi","città degli studi"], v:"Città Studi"},
    {k:["cadore"], v:"Cadore"},
    {k:["susa","argonne"], v:"Susa/Argonne"},
    {k:["porta romana"], v:"Porta Romana"},
    {k:["isola","garibaldi"], v:"Isola / Garibaldi"},
    {k:["nolo","loreto"], v:"Nolo"},
    {k:["dateo","porta venezia"], v:"Porta Venezia"},
    {k:["lambrate"], v:"Lambrate"},
    {k:["navigli","naviglio"], v:"Navigli"},
    {k:["greco","turro"], v:"Greco / Turro"},
  ];
  let zona = null;
  for (const z of zoneMap) {
    if (z.k.some(k => cl.includes(k))) { zona = z.v; break; }
  }

  let contatto = null;
  const tel = c.match(/3\d{2}[\s.]?\d{3}[\s.]?\d{4}/);
  const email = c.match(/[\w.+-]+@[\w-]+\.[a-z]{2,}/i);
  if (tel) contatto = tel[0].trim();
  else if (email) contatto = email[0];

  const tipoLabel = tipo !== "altro" ? tipo : "immobile";
  const titolo = tipoLabel.charAt(0).toUpperCase()+tipoLabel.slice(1) +
    (zona ? " · "+zona : "") +
    (dimensione ? " · "+dimensione+"mq" : "") +
    (prezzo ? " · €"+Number(prezzo).toLocaleString("it-IT") : "");

  const note = c.slice(0,80).split("\n").join(" ");

  return {titolo, tipo, operazione, prezzo, dimensione, zona, piano, condizioni, terrazzo, box, cantina, contatto, note};
}

function IGScraperTab({onSaveToAnnunci}) {
  const [posts, setPosts] = useState([]);
  const [totalRaw, setTotalRaw] = useState(0);
  const [loading, setLoading] = useState(false);
  const [analyzed, setAnalyzed] = useState({});
  const [discarded, setDiscarded] = useState({});
  const [saved, setSaved] = useState({});
  const [analyzing, setAnalyzing] = useState(false);
  const [progress, setProgress] = useState(0);
  const [error, setError] = useState(null);
  const [showDiscard, setShowDiscard] = useState(false);
  const [datasetId, setDatasetId] = useState(APIFY_DATASET_ID);
  const [apiKey, setApiKey] = useState(localStorage.getItem("apify_key") || "");

  const saveKey = k => { setApiKey(k); localStorage.setItem("apify_key", k); };

  const loadPosts = async () => {
    if (!apiKey) { setError("Inserisci la Apify API key."); return; }
    setLoading(true); setError(null); setPosts([]); setAnalyzed({}); setDiscarded({}); setSaved({}); setProgress(0);
    try {
      const res = await fetchApifyDataset(datasetId, apiKey);
      setTotalRaw(res.total);
      setPosts(res.filtered);
    } catch(e) { setError(e.message); }
    setLoading(false);
  };

  const runAnalysis = async () => {
    const todo = posts.filter(p => !analyzed[p.id||p.url] && !discarded[p.id||p.url]);
    setAnalyzing(true);
    setProgress(0);
    const ok = {};
    const ko = {};
    for (let i = 0; i < todo.length; i++) {
      const post = todo[i];
      const key = post.id || post.url;
      try {
        const info = parseCaption(post.caption);
        if (postFilter(info)) ok[key] = info;
        else ko[key] = info;
      } catch(e) {}
      setProgress(i + 1);
      if (i % 10 === 9) await new Promise(r => setTimeout(r, 10));
    }
    setAnalyzed(prev => ({...prev, ...ok}));
    setDiscarded(prev => ({...prev, ...ko}));
    setAnalyzing(false);
  };

  const salva = async (post, info) => {
    const key = post.id || post.url;
    const vaniMap = {bilocale:"2", trilocale:"3", monolocale:"1", quadrilocale:"4"};
    const zoneAppMap = {"Città Studi":"Città Studi","Cadore":"Cadore","Susa/Argonne":"Susa","Porta Romana":"Porta Romana","Isola / Garibaldi":"Isola / Garibaldi","Nolo":"Nolo","Porta Venezia":"Porta Venezia","Lambrate":"Lambrate","Navigli":"Navigli","Greco / Turro":"Greco / Turro"};
    await onSaveToAnnunci({
      titolo: info.titolo || "Post IG",
      zona: zoneAppMap[info.zona] || info.zona || "Altra zona",
      indirizzo: "",
      fonte: "Instagram",
      prezzo: info.prezzo ? String(info.prezzo) : "",
      dimensione: info.dimensione ? String(info.dimensione) : "",
      vani: vaniMap[info.tipo] || "",
      piano: info.piano || "",
      condizioni: info.condizioni || "Buono",
      terrazzo: !!info.terrazzo,
      box: !!info.box,
      cantina: !!info.cantina,
      voto: 3,
      note: (info.contatto ? "📞 "+info.contatto+" · " : "") + (info.note||"").slice(0,150),
      link: post.url || "",
    });
    setSaved(prev => ({...prev, [key]: true}));
  };

  const passedPosts = posts.filter(p => analyzed[p.id||p.url]);
  const pendingCount = posts.filter(p => !analyzed[p.id||p.url] && !discarded[p.id||p.url]).length;
  const discardedCount = Object.keys(discarded).length;

  const Card = ({post, info, isSaved, dim}) => (
    <div style={{background: dim?"#6B2810":"#8B3214", borderRadius:12, overflow:"hidden", boxShadow:"0 2px 8px rgba(0,0,0,.25)", display:"flex", flexDirection:"column", opacity: dim?.7:1}}>
      {post.displayUrl && (
        <div style={{height:140, overflow:"hidden", flexShrink:0}}>
          <img src={post.displayUrl} alt="" style={{width:"100%", height:"100%", objectFit:"cover"}} onError={e=>{e.target.style.display="none"}}/>
        </div>
      )}
      <div style={{padding:12, display:"flex", flexDirection:"column", gap:8, flex:1}}>
        <div style={{display:"flex", gap:5, flexWrap:"wrap"}}>
          {info.tipo && info.tipo !== "altro" && <span style={{fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:20, background:"#833AB4", color:"#FAF0E6"}}>{info.tipo}</span>}
          <CondBadge cond={info.condizioni}/>
          {info.operazione === "affitto" && <span style={{fontSize:10, padding:"2px 6px", borderRadius:4, background:"#dc2626", color:"white"}}>affitto</span>}
        </div>
        <div style={{fontSize:12, fontWeight:700, fontFamily:"Playfair Display,serif", color:"#FAF0E6", lineHeight:1.3}}>{info.titolo}</div>
        <div style={{display:"flex", gap:5, flexWrap:"wrap"}}>
          {info.prezzo && <Chip bg="#B5921B">{fmt(info.prezzo)}</Chip>}
          {info.dimensione && <Chip bg="#B5921B">{fmtM(info.dimensione)}</Chip>}
          {info.zona && <Chip>📍 {info.zona}</Chip>}
        </div>
        <div style={{display:"flex", gap:4, flexWrap:"wrap"}}>
          {info.terrazzo && <Chip bg="#d1fae5" color="#065f46">🌿 Terrazzo</Chip>}
          {info.box && <Chip bg="#e0e7ff" color="#3730a3">🚗 Box</Chip>}
          {info.cantina && <Chip bg="#fef9c3" color="#713f12">📦 Cantina</Chip>}
          {info.contatto && <Chip bg="#1e3a5f" color="#bfdbfe">📞 {info.contatto.slice(0,18)}</Chip>}
        </div>
        <div style={{display:"flex", gap:8, marginTop:"auto", paddingTop:8, borderTop:"1px solid rgba(255,255,255,.15)", alignItems:"center"}}>
          <a href={post.url} target="_blank" rel="noopener noreferrer" style={{fontSize:12, color:"#E8C9A0", textDecoration:"none", fontWeight:700, flex:1}}>IG →</a>
          {!dim && !isSaved && <button onClick={()=>salva(post, info)} style={{...btn, padding:"5px 12px", fontSize:11}}>＋ Salva</button>}
          {isSaved && <span style={{fontSize:11, color:"#7EC87E", fontWeight:700}}>✓ Salvato</span>}
        </div>
      </div>
    </div>
  );

  return (
    <div style={{padding:"16px 16px 60px", maxWidth:760, margin:"0 auto"}}>
      <div style={{background:"#8B3214", borderRadius:12, padding:18, marginBottom:16}}>
        <div style={{fontFamily:"Playfair Display,serif", fontSize:18, fontWeight:700, color:"#FAF0E6", marginBottom:6}}>📸 IG Scraper</div>
        <div style={{fontSize:11, fontFamily:"Courier Prime,monospace", color:"#E8C9A0", marginBottom:12}}>
          Filtri: <b style={{color:"#fff"}}>vendita · bilocale/trilocale · ≥70mq · ≤€520k</b>
        </div>
        <div style={{display:"flex", gap:8, marginBottom:8}}>
          <input style={{...fi, flex:1, fontSize:12, padding:"8px 10px"}} type="password" placeholder="🔑 Apify API key" value={apiKey} onChange={e=>saveKey(e.target.value)}/>
          {apiKey && <span style={{fontSize:11, color:"#7EC87E", alignSelf:"center", whiteSpace:"nowrap"}}>✓ ok</span>}
        </div>
        <div style={{display:"flex", gap:8}}>
          <input style={{...fi, flex:1, fontSize:12, padding:"8px 10px"}} placeholder="Dataset ID" value={datasetId} onChange={e=>setDatasetId(e.target.value)}/>
          <button onClick={loadPosts} disabled={loading} style={{...btn, whiteSpace:"nowrap", opacity:loading?.6:1}}>
            {loading ? "⏳…" : "📥 Carica"}
          </button>
        </div>
      </div>

      {error && <div style={{background:"#7f1d1d", borderRadius:10, padding:14, marginBottom:14, fontSize:13, color:"#fca5a5"}}>{error}</div>}

      {posts.length > 0 && (
        <>
          <div style={{background:"#9B3A17", borderRadius:10, padding:"12px 16px", marginBottom:14, display:"flex", gap:16, flexWrap:"wrap"}}>
            <Stat label="Raw Apify" val={totalRaw}/>
            <Stat label="Pre-filtrati" val={posts.length}/>
            <Stat label="✅ In target" val={passedPosts.length}/>
            <Stat label="❌ Scartati" val={discardedCount}/>
            <Stat label="⏳ Da fare" val={pendingCount}/>
          </div>

          {analyzing && (
            <div style={{background:"#8B3214", borderRadius:8, padding:"10px 14px", marginBottom:12}}>
              <div style={{fontSize:12, color:"#E8C9A0", marginBottom:6}}>Analisi {progress}/{posts.length}</div>
              <div style={{background:"rgba(0,0,0,.3)", borderRadius:4, height:6}}>
                <div style={{background:"#B5921B", borderRadius:4, height:6, width:`${(progress/posts.length)*100}%`, transition:"width .2s"}}/>
              </div>
            </div>
          )}

          {pendingCount > 0 && !analyzing && (
            <button onClick={runAnalysis} style={{...btn, background:"#6d28d9", width:"100%", padding:12, marginBottom:14, fontSize:14}}>
              🔍 Analizza {pendingCount} post
            </button>
          )}

          {passedPosts.length > 0 && (
            <>
              <div style={{fontSize:12, fontWeight:700, color:"#7EC87E", marginBottom:10, textTransform:"uppercase", letterSpacing:1}}>✅ {passedPosts.length} annunci in target</div>
              <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))", gap:12, marginBottom:20}}>
                {passedPosts.map(p => <Card key={p.id||p.url} post={p} info={analyzed[p.id||p.url]} isSaved={saved[p.id||p.url]} dim={false}/>)}
              </div>
            </>
          )}

          {discardedCount > 0 && (
            <>
              <button onClick={()=>setShowDiscard(s=>!s)} style={{background:"transparent", border:"1px solid rgba(255,255,255,.2)", borderRadius:8, padding:"7px 14px", fontSize:12, color:"#E8C9A0", cursor:"pointer", marginBottom:10}}>
                {showDiscard?"▲":"▼"} {discardedCount} scartati
              </button>
              {showDiscard && (
                <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))", gap:12}}>
                  {posts.filter(p=>discarded[p.id||p.url]).map(p => <Card key={p.id||p.url} post={p} info={discarded[p.id||p.url]} isSaved={false} dim={true}/>)}
                </div>
              )}
            </>
          )}
        </>
      )}

      {!loading && posts.length === 0 && !error && (
        <div style={{textAlign:"center", padding:"50px 20px", color:"#E8C9A0"}}>
          <div style={{fontSize:48, marginBottom:12}}>📸</div>
          <div style={{fontSize:16, fontWeight:700, fontFamily:"Playfair Display,serif", color:"#FAF0E6", marginBottom:8}}>Premi Carica</div>
          <p style={{fontSize:13, maxWidth:300, margin:"0 auto", lineHeight:1.6}}>I post vengono pre-filtrati per testo, poi analizzati localmente — nessuna API esterna.</p>
        </div>
      )}
    </div>
  );
}


// ── APP ──────────────────────────────────────────────────────────────
function App(){
  const [dbReady, setDbReady] = useState(!!window.__dbReady);
  const [listings, setListings] = useState([]);
  const [tab, setTab] = useState("ricerche");
  const [form, setForm] = useState(EMPTY);
  const [editId, setEditId] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [saving, setSaving] = useState(false);
  const [fZona, setFZona] = useState("Tutte");
  const [fFonte, setFFonte] = useState("Tutte");
  const [fCond, setFCond] = useState("Tutte");
  const [fSort, setFSort] = useState("data_desc");
  const [fQuery, setFQuery] = useState("");

  useEffect(()=>{
    if(window.__dbReady){ setDbReady(true); return; }
    const h = ()=>setDbReady(true);
    window.addEventListener("dbReady", h);
    return ()=>window.removeEventListener("dbReady", h);
  },[]);

  useEffect(()=>{
    if(!dbReady) return;
    const unsub = window.__db.subscribe(docs=>{
      docs.sort((a,b)=>(b._ts?.seconds||0)-(a._ts?.seconds||0));
      setListings(docs);
    });
    return unsub;
  },[dbReady]);

  const geocode = async (indirizzo, zona) => {
    const q = `${indirizzo||""} ${zona||""} Milano, Italy`.trim();
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);
      const data = await res.json();
      if(data.length) return {lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon)};
    } catch(e){}
    return null;
  };

  const saveForm = async (dataOverride=null)=>{
    const data = dataOverride || form;
    if(!data.link&&!data.titolo) return;
    setSaving(true);
    try {
      const {_id,_ts,...d} = data;
      if((d.indirizzo||d.zona) && !d.lat) {
        const coords = await geocode(d.indirizzo, d.zona);
        if(coords){ d.lat = coords.lat; d.lng = coords.lng; }
      }
      if(dataOverride) {
        await window.__db.add(d);
      } else if(editId!==null){
        await window.__db.update(editId, d);
        setEditId(null); setForm(EMPTY); setTab("annunci");
      } else {
        await window.__db.add(d);
        setForm(EMPTY); setTab("annunci");
      }
    } catch(e){ alert("Errore salvataggio: "+e.message); }
    setSaving(false);
  };

  const startEdit = l=>{ setForm({...l}); setEditId(l._id); setTab("aggiungi"); };
  const delItem = async id=>{ await window.__db.remove(id); setConfirm(null); };

  const filtered = useMemo(()=>{
    let r = listings.filter(l=>{
      if(fZona !=="Tutte"&&l.zona !==fZona) return false;
      if(fFonte!=="Tutte"&&l.fonte !==fFonte) return false;
      if(fCond !=="Tutte"&&l.condizioni!==fCond) return false;
      if(fQuery){
        const q=fQuery.toLowerCase();
        if(![l.titolo,l.zona,l.indirizzo,l.note,l.fonte].some(s=>s?.toLowerCase().includes(q))) return false;
      }
      return true;
    });
    r.sort((a,b)=>{
      if(fSort==="prezzo_asc") return (Number(a.prezzo)||Infinity)-(Number(b.prezzo)||Infinity);
      if(fSort==="prezzo_desc") return (Number(b.prezzo)||0)-(Number(a.prezzo)||0);
      if(fSort==="mq_desc") return (Number(b.dimensione)||0)-(Number(a.dimensione)||0);
      if(fSort==="voto_desc") return (Number(b.voto)||0)-(Number(a.voto)||0);
      if(fSort==="ppm") return (a.prezzo/a.dimensione||Infinity)-(b.prezzo/b.dimensione||Infinity);
      return 0;
    });
    return r;
  },[listings,fZona,fFonte,fCond,fSort,fQuery]);

  const withP = filtered.filter(l=>Number(l.prezzo)>0);
  const withPM = filtered.filter(l=>Number(l.prezzo)>0&&Number(l.dimensione)>0);
  const stats = {
    tot: filtered.length,
    minP: withP.length ? Math.min(...withP.map(l=>Number(l.prezzo))) : 0,
    avgP: withP.length ? Math.round(withP.reduce((s,l)=>s+Number(l.prezzo),0)/withP.length) : 0,
    avgPM:withPM.length ? Math.round(withPM.reduce((s,l)=>s+l.prezzo/l.dimensione,0)/withPM.length) : 0,
  };

  const goAdd = ()=>{ setForm(EMPTY); setEditId(null); setTab("aggiungi"); };

  // Import email parser
  function streetFromTitle(title=""){
    const m=title.match(/\b(via|viale|corso|piazza|largo|vicolo|borgo|strada)\s+[a-zA-ZÀ-ú\s']+/i);
    return m?m[0].trim():"";
  }

  function parseEmail(raw=""){
    const lines=raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    let titolo="",prezzo="",dimensione="",zona="",fonte="Altro",link="",indirizzo="";
    for(const line of lines){
      if(!titolo&&(line.match(/locali|bilocale|trilocale|appartamento|monolocale/i)||line.length>20&&line.length<120)) titolo=line;
      const pm=line.match(/€?\s*([\d.,']+)\s*€?/);
      if(!prezzo&&pm){
        const n=parseInt(pm[1].replace(/[.,'\s]/g,""));
        if(n>50000&&n<3000000) prezzo=String(n);
      }
      const mm=line.match(/(\d+)\s*m²/i);
      if(!dimensione&&mm) dimensione=mm[1];
      if(!zona){
        for(const z of ZONE){if(line.toLowerCase().includes(z.toLowerCase())){zona=z;break;}}
      }
      if(!fonte){
        if(line.toLowerCase().includes("immobiliare.it")) fonte="Immobiliare.it";
        else if(line.toLowerCase().includes("idealista")) fonte="Idealista";
        else if(line.toLowerCase().includes("casa.it")) fonte="Casa.it";
      }
    }
    if(!indirizzo) indirizzo=streetFromTitle(titolo);
    return {titolo,prezzo,dimensione,zona:zona||"Altra zona",fonte,link,indirizzo,condizioni:"Buono",voto:3,terrazzo:false,box:false,cantina:false,note:"",vani:"",piano:""};
  }

  if(!dbReady) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#8B3214",color:"#E8C9A0",fontFamily:"Courier Prime,Courier New,monospace",fontSize:22,flexDirection:"column",gap:12}}>
      <div>🏠</div><div>Connessione in corso…</div>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:"#B5451B"}}>
      {/* HEADER */}
      <div style={{background:"#8B3214",padding:"env(safe-area-inset-top,16px) 18px 0",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(0,0,0,.35)"}}>
        <div style={{paddingTop:8}}>
          <div style={{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#E8C9A0",fontFamily:"Courier Prime,Courier New,monospace"}}>🏙 Monitor Immobiliare · Milano</div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <h1 style={{fontSize:26,fontWeight:700,color:"#FAF0E6",letterSpacing:-1,margin:"2px 0 10px",fontFamily:"Playfair Display,Georgia,serif"}}>Caccia Casa</h1>
            <div style={{fontSize:10,fontFamily:"Courier Prime,Courier New,monospace",color:"#7EC87E"}}>● live</div>
          </div>
        </div>
        <nav style={{display:"flex",overflowX:"auto"}}>
          {[
            {id:"ricerche",icon:"🔗",label:"Ricerche"},
            {id:"annunci", icon:"📋",label:`Annunci (${listings.length})`},
            {id:"mappa",   icon:"🗺", label:"Mappa"},
            {id:"ig",      icon:"📸", label:"IG"},
            {id:"aggiungi",icon:editId!==null?"✏️":"＋",label:editId!==null?"Modifica":"Aggiungi"},
          ].map(t=>(
            <button key={t.id}
              onClick={()=>{ if(t.id==="aggiungi"&&editId===null) setForm(EMPTY); setTab(t.id); }}
              style={{background:"transparent",border:"none",borderBottom:`3px solid ${tab===t.id?"#E8C9A0":"transparent"}`,padding:"10px 14px",fontSize:12,fontFamily:"Courier Prime,Courier New,monospace",color:tab===t.id?"#E8C9A0":"#C4967A",cursor:"pointer",display:"flex",alignItems:"center",gap:4,whiteSpace:"nowrap"}}>
              <span style={{fontSize:15}}>{t.icon}</span>{t.label}
            </button>
          ))}
        </nav>
      </div>

      {/* TAB RICERCHE */}
      {tab==="ricerche"&&(
        <div style={{padding:"20px 16px 40px",maxWidth:760,margin:"0 auto"}}>
          <div style={{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#E8C9A0",fontFamily:"Courier Prime,Courier New,monospace",marginBottom:12,opacity:.7}}>🏢 Piattaforme e agenzie immobiliari</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:10}}>
            {SEARCHES.map(({nome,url})=>(
              <a key={nome} href={url} target="_blank" rel="noopener noreferrer"
                style={{background:"#8B3214",borderRadius:10,padding:14,borderLeft:"4px solid #B5921B",display:"flex",flexDirection:"column",gap:6,textDecoration:"none",color:"inherit",boxShadow:"0 2px 6px rgba(0,0,0,.2)"}}>
                <Badge fonte={nome}/>
                <div style={{fontSize:14,fontWeight:700,fontFamily:"Playfair Display,Georgia,serif",color:"#FAF0E6"}}>Cerca su {nome}</div>
                <div style={{fontSize:10,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",lineHeight:1.4,opacity:.7}}>{url.replace("https://","").slice(0,44)}…</div>
                <div style={{background:"#B5921B",color:"#FAF0E6",borderRadius:6,padding:"6px 12px",fontSize:12,fontWeight:700,fontFamily:"Courier Prime,Courier New,monospace",alignSelf:"flex-start"}}>Apri →</div>
              </a>
            ))}
          </div>
          <div style={{height:1,background:"rgba(255,255,255,.15)",margin:"22px 0"}}/>
          <div style={{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#E8C9A0",fontFamily:"Courier Prime,Courier New,monospace",marginBottom:12,opacity:.7}}>📸 Profili Instagram da monitorare</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:10}}>
            {SOCIALS.map(({nome,follower,url,note})=>(
              <a key={nome} href={url} target="_blank" rel="noopener noreferrer"
                style={{background:"#8B3214",borderRadius:10,padding:14,borderLeft:"4px solid #B5921B",display:"flex",flexDirection:"column",gap:6,textDecoration:"none",color:"inherit",boxShadow:"0 2px 6px rgba(0,0,0,.2)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:10,fontWeight:700,fontFamily:"Courier Prime,Courier New,monospace",padding:"2px 8px",borderRadius:20,background:"#B5921B",color:"#FAF0E6"}}>📸 Instagram</span>
                  {follower!=="—"&&<span style={{fontSize:10,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",opacity:.7}}>{follower}</span>}
                </div>
                <div style={{fontSize:13,fontWeight:700,fontFamily:"Playfair Display,Georgia,serif",color:"#FAF0E6"}}>{nome}</div>
                <div style={{fontSize:11,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",lineHeight:1.4,opacity:.7}}>{note}</div>
                <div style={{fontSize:11,fontFamily:"Courier Prime,Courier New,monospace",color:"#B5921B",fontWeight:700}}>Apri e attiva 🔔 →</div>
              </a>
            ))}
          </div>
          <div style={{marginTop:28,background:"#8B3214",borderRadius:12,padding:20,color:"#FAF0E6"}}>
            <div style={{fontSize:13,fontWeight:700,fontFamily:"Courier Prime,Courier New,monospace",marginBottom:8,color:"#E8C9A0"}}>📱 Aggiungi alla Home dell'iPhone</div>
            <div style={{fontSize:13,fontFamily:"Courier Prime,Courier New,monospace",lineHeight:1.8,color:"#E8C9A0"}}>
              1. Apri questa pagina in <b style={{color:"#fff"}}>Safari</b><br/>
              2. Tocca l'icona <b style={{color:"#fff"}}>Condividi</b> (quadrato con freccia ↑)<br/>
              3. Tocca <b style={{color:"#fff"}}>"Aggiungi alla schermata Home"</b><br/>
              4. Icona sul desktop, schermo intero, dati sincronizzati ovunque! 🎉
            </div>
          </div>
        </div>
      )}

      {/* TAB MAPPA */}
      {tab==="mappa"&&(
        <div style={{padding:"16px 16px 40px",maxWidth:760,margin:"0 auto"}}>
          <MapView listings={listings}/>
        </div>
      )}

      {/* TAB IG SCRAPER */}
      {tab==="ig"&&(
        <IGScraperTab onSaveToAnnunci={async (annuncio)=>{
          await saveForm(annuncio);
        }}/>
      )}

      {/* TAB ANNUNCI */}
      {tab==="annunci"&&(
        <div style={{padding:"16px 16px 40px",maxWidth:760,margin:"0 auto"}}>
          <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:12,alignItems:"center"}}>
            <input style={{...fi,flex:2,minWidth:120,padding:"7px 10px",fontSize:13}} placeholder="🔍 Cerca..." value={fQuery} onChange={e=>setFQuery(e.target.value)}/>
            <Sel value={fZona} onChange={setFZona} opts={["Tutte",...ZONE]}/>
            <Sel value={fFonte} onChange={setFFonte} opts={["Tutte",...SOURCES]}/>
            <Sel value={fCond} onChange={setFCond} opts={["Tutte",...Object.keys(COND)]}/>
            <Sel value={fSort} onChange={setFSort} opts={[
              {v:"data_desc",l:"Recenti"},{v:"prezzo_asc",l:"Prezzo ↑"},
              {v:"prezzo_desc",l:"Prezzo ↓"},{v:"ppm",l:"€/m² ↑"},
              {v:"voto_desc",l:"Voto ↓"},{v:"mq_desc",l:"m² ↓"},
            ]}/>
            <button onClick={goAdd} style={{...btn,padding:"7px 16px",fontSize:20,lineHeight:1}}>＋</button>
          </div>
          {listings.length>0&&(
            <div style={{display:"flex",gap:18,background:"#9B3A17",borderRadius:10,padding:"11px 16px",marginBottom:14,flexWrap:"wrap"}}>
              <Stat label="Filtrati" val={stats.tot}/>
              <Stat label="Prezzo min" val={stats.minP?fmt(stats.minP):"—"}/>
              <Stat label="Media" val={stats.avgP?fmt(stats.avgP):"—"}/>
              <Stat label="€/m² medio" val={stats.avgPM?`€ ${stats.avgPM.toLocaleString("it-IT")}/m²`:"—"}/>
            </div>
          )}
          {listings.length===0?(
            <div style={{textAlign:"center",padding:"56px 20px",fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0"}}>
              <div style={{fontSize:52,marginBottom:12}}>🏠</div>
              <div style={{fontSize:18,fontWeight:700,fontFamily:"Playfair Display,Georgia,serif",color:"#FAF0E6",marginBottom:10}}>Nessun annuncio ancora</div>
              <p style={{maxWidth:340,margin:"0 auto 20px",lineHeight:1.6,fontSize:14}}>Vai su Ricerche, trova un appartamento e aggiungilo con il link diretto.</p>
              <button onClick={goAdd} style={btn}>＋ Aggiungi il primo</button>
            </div>
          ):filtered.length===0?(
            <div style={{textAlign:"center",padding:"40px 20px",fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0"}}>
              <div style={{fontSize:36}}>🔎</div>
              <div style={{fontSize:17,fontWeight:700,fontFamily:"Playfair Display,Georgia,serif",color:"#FAF0E6",margin:"10px 0 6px"}}>Nessun risultato</div>
            </div>
          ):(
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
              {filtered.map(l=>{
                const cc=COND[l.condizioni]||"#888";
                return (
                  <div key={l._id} style={{background:"#8B3214",borderRadius:12,padding:16,border:"none",display:"flex",flexDirection:"column",gap:9,boxShadow:"0 2px 8px rgba(0,0,0,.2)"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:6}}>
                      <Badge fonte={l.fonte}/>
                      <CondBadge cond={l.condizioni}/>
                    </div>
                    <div style={{fontSize:14,fontWeight:600,lineHeight:1.4,fontFamily:"Playfair Display,Georgia,serif",color:"#FAF0E6"}}>{l.titolo||<em style={{color:"#E8C9A0",fontWeight:400,opacity:.6}}>Senza titolo</em>}</div>
                    {(l.zona||l.indirizzo)&&(
                      <div style={{fontSize:12,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0"}}>
                        📍 <b>{l.zona}</b>{l.indirizzo&&<span style={{color:"#E8C9A0",opacity:.7}}> · {l.indirizzo}</span>}
                      </div>
                    )}
                    <div style={{display:"flex",background:"#B5921B",borderRadius:8,overflow:"hidden"}}>
                      {[{v:fmt(l.prezzo),k:"Prezzo"},{v:fmtM(l.dimensione),k:"Superficie"},{v:l.vani?`${l.vani} vani`:"—",k:"Locali"}].map((s,j)=>(
                        <div key={j} style={{flex:1,padding:"8px 4px",textAlign:"center",borderLeft:j?"1px solid rgba(255,255,255,.3)":"none"}}>
                          <div style={{fontSize:12,fontWeight:700,fontFamily:"Courier Prime,Courier New,monospace",color:"#FAF0E6"}}>{s.v}</div>
                          <div style={{fontSize:9,fontFamily:"Courier Prime,Courier New,monospace",color:"#FAF0E6",opacity:.8,textTransform:"uppercase",letterSpacing:.5,marginTop:2}}>{s.k}</div>
                        </div>
                      ))}
                    </div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                      {l.piano&&<Chip>🏢 {l.piano}</Chip>}
                      {ppm(l.prezzo,l.dimensione)&&<Chip>{ppm(l.prezzo,l.dimensione)}</Chip>}
                      {l.terrazzo&&<Chip bg="#d1fae5" color="#065f46">🌿 Terrazzo</Chip>}
                      {l.box&&<Chip bg="#e0e7ff" color="#3730a3">🚗 Box</Chip>}
                      {l.cantina&&<Chip bg="#fef9c3" color="#713f12">📦 Cantina</Chip>}
                    </div>
                    {l.voto>0&&<div style={{fontSize:18,color:"#B5921B",letterSpacing:2}}>{"★".repeat(l.voto)}{"☆".repeat(5-l.voto)}</div>}
                    {l.note&&<div style={{fontSize:12,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",fontStyle:"italic",lineHeight:1.4}}>💬 {l.note}</div>}
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",borderTop:"1px solid rgba(255,255,255,.2)",paddingTop:10,marginTop:2}}>
                      {l.link?<a href={l.link} target="_blank" rel="noopener noreferrer" style={{fontSize:13,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",fontWeight:700,textDecoration:"none"}}>Vedi annuncio →</a>:<span/>}
                      <div style={{display:"flex",gap:6}}>
                        <button onClick={()=>startEdit(l)} style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:7,padding:"6px 10px",cursor:"pointer",fontSize:14}}>✏️</button>
                        <button onClick={()=>setConfirm(l._id)} style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:7,padding:"6px 10px",cursor:"pointer",fontSize:14}}>🗑</button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* TAB AGGIUNGI */}
      {tab==="aggiungi"&&(
        <div style={{padding:"20px 16px 60px",maxWidth:680,margin:"0 auto"}}>
          <div style={{background:"#8B3214",borderRadius:12,padding:22,border:"none"}}>
            <h2 style={{fontSize:20,fontWeight:700,fontFamily:"Playfair Display,Georgia,serif",color:"#FAF0E6",margin:"0 0 4px"}}>{editId!==null?"✏️ Modifica":"＋ Nuovo annuncio"}</h2>
            <p style={{fontSize:13,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",margin:"0 0 20px",lineHeight:1.6}}>Incolla il link dell'annuncio. Gli altri campi sono facoltativi.</p>
            <div className="fg" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px 16px"}}>
              <FRow label="🔗 Link annuncio" span={2}>
                <input style={fi} placeholder="https://www.immobiliare.it/annunci/12345678/" value={form.link} onChange={e=>setForm(f=>({...f,link:e.target.value}))}/>
              </FRow>
              <FRow label="Titolo">
                <input style={fi} placeholder="es. Trilocale con terrazzo" value={form.titolo} onChange={e=>setForm(f=>({...f,titolo:e.target.value}))}/>
              </FRow>
              <FRow label="Fonte">
                <select style={fi} value={form.fonte} onChange={e=>setForm(f=>({...f,fonte:e.target.value}))}>
                  {SOURCES.map(s=><option key={s}>{s}</option>)}
                </select>
              </FRow>
              <FRow label="Zona">
                <select style={fi} value={form.zona} onChange={e=>setForm(f=>({...f,zona:e.target.value}))}>
                  <option value="">— seleziona —</option>
                  {ZONE.map(z=><option key={z}>{z}</option>)}
                </select>
              </FRow>
              <FRow label="Indirizzo">
                <input style={fi} placeholder="Via Roma 12" value={form.indirizzo} onChange={e=>setForm(f=>({...f,indirizzo:e.target.value}))}/>
              </FRow>
              <FRow label="Prezzo (€)">
                <input style={fi} type="number" inputMode="numeric" placeholder="380000" value={form.prezzo} onChange={e=>setForm(f=>({...f,prezzo:e.target.value}))}/>
              </FRow>
              <FRow label="Superficie (m²)">
                <input style={fi} type="number" inputMode="numeric" placeholder="85" value={form.dimensione} onChange={e=>setForm(f=>({...f,dimensione:e.target.value}))}/>
              </FRow>
              <FRow label="Vani">
                <input style={fi} type="number" inputMode="numeric" placeholder="3" value={form.vani} onChange={e=>setForm(f=>({...f,vani:e.target.value}))}/>
              </FRow>
              <FRow label="Piano">
                <input style={fi} placeholder="3° su 5" value={form.piano} onChange={e=>setForm(f=>({...f,piano:e.target.value}))}/>
              </FRow>
              <FRow label="Condizioni">
                <select style={fi} value={form.condizioni} onChange={e=>setForm(f=>({...f,condizioni:e.target.value}))}>
                  {Object.keys(COND).map(c=><option key={c}>{c}</option>)}
                </select>
              </FRow>
              <FRow label="Il tuo voto" span={2}>
                <div style={{display:"flex",gap:6}}>
                  {[1,2,3,4,5].map(n=>(
                    <button key={n} onClick={()=>setForm(f=>({...f,voto:n}))}
                      style={{fontSize:30,background:"none",border:"none",cursor:"pointer",opacity:form.voto>=n?1:.2,padding:0,color:"#f59e0b"}}>★</button>
                  ))}
                </div>
              </FRow>
              <FRow label="Extra" span={2}>
                <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
                  {[["terrazzo","🌿 Terrazzo"],["box","🚗 Box"],["cantina","📦 Cantina"]].map(([k,lbl])=>(
                    <label key={k} style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer",fontSize:14,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0"}}>
                      <input type="checkbox" checked={!!form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.checked}))} style={{width:18,height:18,accentColor:"#B5921B"}}/>
                      {lbl}
                    </label>
                  ))}
                </div>
              </FRow>
              <FRow label="Note" span={2}>
                <textarea style={{...fi,minHeight:70,resize:"vertical"}} placeholder="Osservazioni, contatti, condizioni particolari…" value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))}/>
              </FRow>
            </div>
            <div style={{display:"flex",gap:10,marginTop:20,flexWrap:"wrap"}}>
              <button onClick={()=>saveForm()} disabled={saving||(!form.link&&!form.titolo)}
                style={{...btn,opacity:(saving||(!form.link&&!form.titolo))?.5:1,flex:2}}>
                {saving?"Salvataggio…":editId!==null?"💾 Aggiorna":"💾 Salva annuncio"}
              </button>
              {editId!==null&&<button onClick={()=>{setEditId(null);setForm(EMPTY);setTab("annunci");}} style={{...btn,background:"#9B3A17",flex:1}}>Annulla</button>}
            </div>

            {/* Import email */}
            <div style={{marginTop:28,borderTop:"1px solid rgba(255,255,255,.15)",paddingTop:20}}>
              <div style={{fontSize:12,fontWeight:700,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",marginBottom:8}}>📧 Import da email</div>
              <textarea id="emailPaste" style={{...fi,minHeight:90,fontSize:12,resize:"vertical"}} placeholder="Incolla qui il testo dell'email ricevuta da Immobiliare.it, Idealista, Casa.it…"/>
              <button style={{...btn,marginTop:8,fontSize:13}} onClick={()=>{
                const raw=document.getElementById("emailPaste").value;
                if(!raw) return;
                const parsed=parseEmail(raw);
                setForm(f=>({...f,...parsed}));
                document.getElementById("emailPaste").value="";
              }}>📋 Importa</button>
            </div>
          </div>
        </div>
      )}

      {/* DIALOG CONFERMA ELIMINA */}
      {confirm&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999,padding:20}}>
          <div style={{background:"#8B3214",borderRadius:14,padding:28,maxWidth:320,width:"100%",textAlign:"center",fontFamily:"Courier Prime,Courier New,monospace",color:"#FAF0E6"}}>
            <div style={{fontSize:32,marginBottom:12}}>🗑</div>
            <div style={{fontSize:16,fontWeight:700,fontFamily:"Playfair Display,Georgia,serif",marginBottom:8}}>Elimina annuncio?</div>
            <p style={{fontSize:13,color:"#E8C9A0",marginBottom:20}}>Questa azione è irreversibile.</p>
            <div style={{display:"flex",gap:10,justifyContent:"center"}}>
              <button onClick={()=>setConfirm(null)} style={{...btn,background:"#9B3A17",padding:"10px 22px"}}>Annulla</button>
              <button onClick={()=>delItem(confirm)} style={{...btn,background:"#dc2626",padding:"10px 22px"}}>Elimina</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
