<script type="text/babel">
const { useState, useMemo, useEffect, useCallback, useRef } = React;

];
const SOCIALS = [
  {nome:"@carolachiusano",         piattaforma:"Instagram", follower:"126K", url:"https://www.instagram.com/carolachiusano/",         note:"Milano · Torino · Parigi — la più seguita"},
  {nome:"@annabuono_",             piattaforma:"Instagram", follower:"30K",  url:"https://www.instagram.com/annabuono_/",             note:"Caseperfette · CityLife · tutta Milano"},

  {nome:"@immobiliare.it",         piattaforma:"TikTok",    follower:"22.6K",url:"https://www.tiktok.com/@immobiliare.it",            note:"Profilo ufficiale Immobiliare.it"},
  {nome:"@gangimmobiliaremilano",  piattaforma:"TikTok",    follower:"—",    url:"https://www.tiktok.com/@gangimmobiliaremilano",     note:"Agenzia milanese · tour appartamenti"},
  {nome:"@gianlucatorre01",        piattaforma:"TikTok",    follower:"—",    url:"https://www.tiktok.com/@gianlucatorre01",           note:"Tour proprietà · Engel & Völkers Milano"},
  {nome:"@rossomattoneimmobiliare",piattaforma:"TikTok",    follower:"—",    url:"https://www.tiktok.com/@rossomattoneimmobiliare",   note:"RossoMattone su TikTok"},
];

const EMPTY = {
  titolo:"",zona:"",indirizzo:"",fonte:"Immobiliare.it",
  prezzo:"",dimensione:"",vani:"",piano:"",condizioni:"Buono",
  terrazzo:false,box:false,cantina:false,voto:3,note:"",link:"",
  lat:null,lng:null
};

const fmt  = p    => p  ? `€ ${Number(p).toLocaleString("it-IT")}` : "—";
const fmtM = m    => m  ? `${m} m²` : "—";
const ppm  = (p,m)=> p&&m ? `€ ${Math.round(Number(p)/Number(m)).toLocaleString("it-IT")}/m²` : "";

// Estrae via/piazza/corso/ecc. dal titolo dell'annuncio
function streetFromTitle(title) {
  if (!title) return "";
  const m = title.match(
    /\b(via|viale|corso|piazza|piazzale|largo|vicolo|borgo|strada|lungolago|lungofiume|lungomare|lungotevere|alzaia)\s+[a-zA-ZÀ-ú'\s]{2,30}(?:,?\s*\d{1,3})?/i
  );
  if (!m) return "";
  return m[0].trim().replace(/\s+/g, " ");
}

// Geocodifica con Nominatim
async function geocodeAddress(indirizzo) {
  if (!indirizzo) return null;
  try {
    const q = encodeURIComponent(indirizzo + ", Milano, Italia");
    const res = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1&countrycodes=it`,
      { headers: { "Accept-Language": "it" } }
    );
    const data = await res.json();
    if (data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
  } catch(e) {}
  return null;
}

function Badge({fonte}){
  const sc=SRC_COLOR[fonte]||SRC_COLOR["Altro"];
  return <span style={{fontSize:11,fontWeight:700,fontFamily:"Courier Prime,Courier New,monospace",padding:"3px 10px",borderRadius:20,background:sc.bg,color:sc.text,display:"inline-block"}}>{fonte}</span>;
}
function CondBadge({cond}){
  const cc=COND[cond]||"#888";
  return <span style={{fontSize:10,fontFamily:"Courier Prime,Courier New,monospace",border:`1.5px solid ${cc}`,color:cc,borderRadius:4,padding:"2px 7px",fontWeight:700}}>{cond}</span>;
}
function Chip({children,bg="#9B3A17",color="#E8C9A0"}){
  return <span style={{fontSize:11,fontFamily:"Arial,sans-serif",background:bg,color,borderRadius:4,padding:"3px 8px",whiteSpace:"nowrap"}}>{children}</span>;
}
function Sel({value,onChange,opts}){
  return (
    <select value={value} onChange={e=>onChange(e.target.value)}

      {opts.map(o=>typeof o==="string"
        ?<option key={o} value={o}>{o}</option>
        :<option key={o.v} value={o.v}>{o.l}</option>)}

  );
}
function Stat({label,val}){
  return (
    <div style={{display:"flex",flexDirection:"column",gap:2}}>
      <div style={{fontSize:9,fontFamily:"Arial,sans-serif",color:"#C4967A",textTransform:"uppercase",letterSpacing:1}}>{label}</div>
      <div style={{fontSize:15,fontWeight:700,fontFamily:"Courier Prime,Courier New,monospace",color:"#FAF0E6"}}>{val}</div>
    </div>

}
function FRow({label,children,span=1}){
  return (
    <div style={{gridColumn:`span ${span}`,display:"flex",flexDirection:"column",gap:5}}>
      <label style={{fontSize:12,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",fontWeight:600}}>{label}</label>
      {children}

}

const fi  = {border:"1px solid rgba(255,255,255,.3)",borderRadius:7,padding:"10px 12px",fontSize:15,fontFamily:"Courier Prime,Courier New,monospace",outline:"none",background:"#9B3A17",width:"100%",boxSizing:"border-box",color:"#FAF0E6"};
const btn = {background:"#B5921B",color:"#FAF0E6",border:"none",borderRadius:8,padding:"10px 18px",fontSize:14,fontWeight:700,fontFamily:"Courier Prime,Courier New,monospace",cursor:"pointer"};

// ─── MAPPA ────────────────────────────────────────────────────────────────────
function MapTab({ listings }) {
  const containerRef = useRef(null);
  const mapRef       = useRef(null);

  useEffect(() => {
    if (!containerRef.current) return;

    // Distruggi la mappa precedente se esiste
    if (mapRef.current) {
      mapRef.current.remove();
      mapRef.current = null;
    }

    const map = L.map(containerRef.current, { zoomControl: true })
      .setView([45.4654, 9.1859], 13);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors",
      maxZoom: 19,
    }).addTo(map);

    const withCoords = listings.filter(l => l.lat && l.lng);

    withCoords.forEach(l => {
      const popupHtml = `
        <b>${l.titolo || "Senza titolo"}</b><br>
        📍 ${[l.zona, l.indirizzo].filter(Boolean).join(" · ")}<br>
        ${fmt(l.prezzo)}${l.dimensione ? " · " + fmtM(l.dimensione) : ""}
        ${l.link ? `<a href="${l.link}" target="_blank" class="popup-link">Vedi annuncio →</a>` : ""}
      `;
      L.marker([l.lat, l.lng])
        .addTo(map)
        .bindPopup(popupHtml, { maxWidth: 220 });
    });

    if (withCoords.length === 1) {
      map.setView([withCoords[0].lat, withCoords[0].lng], 15);
    } else if (withCoords.length > 1) {
      const bounds = L.latLngBounds(withCoords.map(l => [l.lat, l.lng]));
      map.fitBounds(bounds, { padding: [40, 40] });
    }

    setTimeout(() => map.invalidateSize(), 120);
    mapRef.current = map;

    return () => {
      map.remove();
      mapRef.current = null;
    };
  }, [listings]);

  const noCoords = listings.filter(l => !l.lat || !l.lng).length;

  return (
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 100px)"}}>
      <div ref={containerRef} style={{flex:1,minHeight:0}} />
      {noCoords > 0 && (
        <div style={{padding:"10px 16px",background:"#9B3A17",fontSize:12,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",lineHeight:1.5}}>
          ⚠️ {noCoords} annuncio{noCoords>1?"i":""} senza coordinate.
          Riaprili con ✏️ e risalva per geocodificarli.
        </div>
      )}
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const [dbReady,  setDbReady]  = useState(!!window.__dbReady);
  const [listings, setListings] = useState([]);
  const [tab,      setTab]      = useState("ricerche");
  const [form,     setForm]     = useState(EMPTY);
  const [editId,   setEditId]   = useState(null);
  const [confirm,  setConfirm]  = useState(null);
  const [saving,   setSaving]   = useState(false);
  const [geocoding,setGeocoding]= useState(false);
  const [fZona,    setFZona]    = useState("Tutte");
  const [fFonte,   setFFonte]   = useState("Tutte");
  const [fCond,    setFCond]    = useState("Tutte");
  const [fSort,    setFSort]    = useState("data_desc");
  const [fQuery,   setFQuery]   = useState("");

  useEffect(()=>{
    if(window.__dbReady){ setDbReady(true); return; }
    const h = ()=>setDbReady(true);
    window.addEventListener("dbReady", h);
    return ()=>window.removeEventListener("dbReady", h);
  },[]);

  useEffect(()=>{
    if(!dbReady) return;
    const unsub = window.__db.subscribe(docs=>{
      docs.sort((a,b)=>(b._ts?.seconds||0)-(a._ts?.seconds||0));
      setListings(docs);
    });
    return unsub;
  },[dbReady]);

  // Quando l'utente incolla il titolo → auto-compila indirizzo
  const onTitoloChange = (val) => {
    const addr = streetFromTitle(val);
    setForm(f => ({
      ...f,
      titolo: val,
      indirizzo: addr || f.indirizzo,   // non sovrascrive se già compilato manualmente
    }));
  };

  const saveForm = async () => {
    if (!form.link && !form.titolo) return;
    setSaving(true);
    try {
      const { _id, _ts, ...data } = form;

      // Geocodifica se c'è un indirizzo e non abbiamo già le coordinate
      if (data.indirizzo && !data.lat) {
        setGeocoding(true);
        const coords = await geocodeAddress(data.indirizzo);
        if (coords) {
          data.lat = coords.lat;
          data.lng = coords.lng;
        }
        setGeocoding(false);
      }

      if (editId !== null) {
        await window.__db.update(editId, data);
      } else {
        await window.__db.add(data);
      }

      setEditId(null);
      setForm(EMPTY);
      setTab("mappa");   // → vai alla mappa dopo il salvataggio
    } catch(e) {
      alert("Errore salvataggio: " + e.message);
    }
    setSaving(false);
    setGeocoding(false);
  };

  const startEdit = l => { setForm({...l}); setEditId(l._id); setTab("aggiungi"); };
  const delItem   = async id => { await window.__db.remove(id); setConfirm(null); };

  const filtered = useMemo(()=>{
    let r = listings.filter(l=>{
      if(fZona !=="Tutte"&&l.zona      !==fZona)  return false;
      if(fFonte!=="Tutte"&&l.fonte     !==fFonte) return false;
      if(fCond !=="Tutte"&&l.condizioni!==fCond)  return false;
      if(fQuery){
        const q=fQuery.toLowerCase();
        if(![l.titolo,l.zona,l.indirizzo,l.note,l.fonte].some(s=>s?.toLowerCase().includes(q))) return false;
      }
      return true;
    });
    r.sort((a,b)=>{
      if(fSort==="prezzo_asc")  return (Number(a.prezzo)||Infinity)-(Number(b.prezzo)||Infinity);
      if(fSort==="prezzo_desc") return (Number(b.prezzo)||0)-(Number(a.prezzo)||0);
      if(fSort==="mq_desc")     return (Number(b.dimensione)||0)-(Number(a.dimensione)||0);
      if(fSort==="voto_desc")   return (Number(b.voto)||0)-(Number(a.voto)||0);
      if(fSort==="ppm")         return (a.prezzo/a.dimensione||Infinity)-(b.prezzo/b.dimensione||Infinity);
      return 0;
    });
    return r;
  },[listings,fZona,fFonte,fCond,fSort,fQuery]);

  const withP  = filtered.filter(l=>Number(l.prezzo)>0);
  const withPM = filtered.filter(l=>Number(l.prezzo)>0&&Number(l.dimensione)>0);
  const stats  = {
    tot:  filtered.length,
    minP: withP.length  ? Math.min(...withP.map(l=>Number(l.prezzo))) : 0,
    avgP: withP.length  ? Math.round(withP.reduce((s,l)=>s+Number(l.prezzo),0)/withP.length) : 0,
    avgPM:withPM.length ? Math.round(withPM.reduce((s,l)=>s+l.prezzo/l.dimensione,0)/withPM.length) : 0,
  };

  const goAdd = ()=>{ setForm(EMPTY); setEditId(null); setTab("aggiungi"); };

  if(!dbReady) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#8B3214",color:"#E8C9A0",fontFamily:"Courier Prime,Courier New,monospace",fontSize:22,flexDirection:"column",gap:12}}>
      <div>🏠</div><div>Connessione in corso…</div>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:"#B5451B"}}>

      {/* HEADER */}
      <div style={{background:"#8B3214",padding:"env(safe-area-inset-top,16px) 18px 0",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(0,0,0,.35)"}}>
        <div style={{paddingTop:8}}>
          <div style={{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#E8C9A0",fontFamily:"Courier Prime,Courier New,monospace"}}>🏙 Monitor Immobiliare · Milano</div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <h1 style={{fontSize:26,fontWeight:700,color:"#FAF0E6",letterSpacing:-1,margin:"2px 0 10px",fontFamily:"Playfair Display,Georgia,serif"}}>Caccia Casa</h1>
            <div style={{fontSize:10,fontFamily:"Courier Prime,Courier New,monospace",color:"#7EC87E"}}>● live</div>
          </div>
        </div>
        <nav style={{display:"flex",overflowX:"auto"}}>
          {[
            {id:"ricerche", icon:"🔗", label:"Ricerche"},
            {id:"annunci",  icon:"📋", label:`Annunci (${listings.length})`},
            {id:"mappa",    icon:"🗺", label:"Mappa"},
            {id:"aggiungi", icon:editId!==null?"✏️":"＋", label:editId!==null?"Modifica":"Aggiungi"},
          ].map(t=>(
            <button key={t.id}
              onClick={()=>{ if(t.id==="aggiungi"&&editId===null) setForm(EMPTY); setTab(t.id); }}
              style={{background:"transparent",border:"none",borderBottom:`3px solid ${tab===t.id?"#E8C9A0":"transparent"}`,padding:"10px 14px",fontSize:12,fontFamily:"Courier Prime,Courier New,monospace",color:tab===t.id?"#E8C9A0":"#C4967A",cursor:"pointer",display:"flex",alignItems:"center",gap:4,whiteSpace:"nowrap"}}>
              <span style={{fontSize:15}}>{t.icon}</span>{t.label}
            </button>
          ))}
        </nav>
      </div>

      {/* TAB RICERCHE */}
      {tab==="ricerche"&&(
        <div style={{padding:"20px 16px 40px",maxWidth:760,margin:"0 auto"}}>
          <p style={{fontSize:14,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",lineHeight:1.7,marginBottom:18}}>
            Apri le piattaforme già filtrate su Milano. Quando trovi un annuncio,
            copia il <b>titolo</b> dal sito e incollalo in <b>＋ Aggiungi</b> — l'indirizzo si compila da solo.
          </p>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:14}}>
            {SEARCHES.map(({nome,url})=>(
              <a key={nome} href={url} target="_blank" rel="noopener noreferrer"
                 style={{background:"#8B3214",borderRadius:10,padding:18,borderLeft:"4px solid #B5921B",display:"flex",flexDirection:"column",gap:8,textDecoration:"none",color:"inherit",boxShadow:"0 2px 6px rgba(0,0,0,.2)"}}>
                <Badge fonte={nome}/>
                <div style={{fontSize:15,fontWeight:700,fontFamily:"Playfair Display,Georgia,serif",color:"#FAF0E6"}}>Cerca su {nome}</div>
                <div style={{fontSize:11,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",lineHeight:1.5,wordBreak:"break-all",opacity:.7}}>{url.replace("https://","").slice(0,46)}…</div>
                <div style={{background:"#B5921B",color:"#FAF0E6",borderRadius:7,padding:"8px 14px",fontSize:13,fontWeight:700,fontFamily:"Courier Prime,Courier New,monospace",alignSelf:"flex-start"}}>Apri →</div>
              </a>
            ))}
          </div>

          {/* Profili social */}
          <div style={{marginTop:28}}>
            <div style={{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#E8C9A0",fontFamily:"Courier Prime,Courier New,monospace",marginBottom:14,opacity:.7}}>📱 Profili Social da monitorare</div>

              {SOCIALS.map(({nome,piattaforma,follower,url,note})=>{

                return (
                  <a key={nome} href={url} target="_blank" rel="noopener noreferrer"
                     style={{background:"#8B3214",borderRadius:10,padding:14,borderLeft:"4px solid #B5921B",display:"flex",flexDirection:"column",gap:6,textDecoration:"none",color:"inherit",boxShadow:"0 2px 6px rgba(0,0,0,.2)"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <span style={{fontSize:11,fontWeight:700,fontFamily:"Courier Prime,Courier New,monospace",padding:"2px 8px",borderRadius:20,background:"#B5921B",color:"#FAF0E6"}}>{isIG?"📸":"🎵"} {piattaforma}</span>
                      {follower!=="—"&&<span style={{fontSize:11,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",opacity:.7}}>{follower}</span>}
                    </div>
                    <div style={{fontSize:13,fontWeight:700,fontFamily:"Playfair Display,Georgia,serif",color:"#FAF0E6"}}>{nome}</div>
                    <div style={{fontSize:11,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",lineHeight:1.4,opacity:.7}}>{note}</div>
                    <div style={{fontSize:12,fontFamily:"Courier Prime,Courier New,monospace",color:"#B5921B",fontWeight:700}}>Apri e attiva 🔔 →</div>
                  </a>
                );
              })}
            </div>
          </div>

          {/* Istruzione iPhone */}
          <div style={{marginTop:28,background:"#8B3214",borderRadius:12,padding:20,color:"#FAF0E6"}}>
            <div style={{fontSize:13,fontWeight:700,fontFamily:"Courier Prime,Courier New,monospace",marginBottom:8,color:"#E8C9A0"}}>📱 Aggiungi alla Home dell'iPhone</div>
            <div style={{fontSize:13,fontFamily:"Courier Prime,Courier New,monospace",lineHeight:1.8,color:"#E8C9A0"}}>
              1. Apri questa pagina in <b style={{color:"#fff"}}>Safari</b><br/>
              2. Tocca l'icona <b style={{color:"#fff"}}>Condividi</b> (quadrato con freccia ↑)<br/>
              3. Tocca <b style={{color:"#fff"}}>"Aggiungi alla schermata Home"</b><br/>
              4. Icona sul desktop, schermo intero, dati sincronizzati ovunque! 🎉
            </div>
          </div>
        </div>
      )}

      {/* TAB ANNUNCI */}
      {tab==="annunci"&&(
        <div style={{padding:"16px 16px 40px",maxWidth:760,margin:"0 auto"}}>
          <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:12,alignItems:"center"}}>
            <input style={{...fi,flex:2,minWidth:120,padding:"7px 10px",fontSize:13}} placeholder="🔍 Cerca..." value={fQuery} onChange={e=>setFQuery(e.target.value)}/>
            <Sel value={fZona}  onChange={setFZona}  opts={["Tutte",...ZONE]}/>
            <Sel value={fFonte} onChange={setFFonte} opts={["Tutte",...SOURCES]}/>
            <Sel value={fCond}  onChange={setFCond}  opts={["Tutte",...Object.keys(COND)]}/>
            <Sel value={fSort}  onChange={setFSort}  opts={[
              {v:"data_desc",l:"Recenti"},{v:"prezzo_asc",l:"Prezzo ↑"},
              {v:"prezzo_desc",l:"Prezzo ↓"},{v:"ppm",l:"€/m² ↑"},
              {v:"voto_desc",l:"Voto ↓"},{v:"mq_desc",l:"m² ↓"},
            ]}/>
            <button onClick={goAdd} style={{...btn,padding:"7px 16px",fontSize:20,lineHeight:1}}>＋</button>
          </div>

          {listings.length>0&&(
            <div style={{display:"flex",gap:18,background:"#9B3A17",borderRadius:10,padding:"11px 16px",marginBottom:14,flexWrap:"wrap"}}>
              <Stat label="Filtrati"   val={stats.tot}/>
              <Stat label="Prezzo min" val={stats.minP?fmt(stats.minP):"—"}/>
              <Stat label="Media"      val={stats.avgP?fmt(stats.avgP):"—"}/>
              <Stat label="€/m² medio" val={stats.avgPM?`€ ${stats.avgPM.toLocaleString("it-IT")}/m²`:"—"}/>
            </div>
          )}

          {listings.length===0?(
            <div style={{textAlign:"center",padding:"56px 20px",fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0"}}>
              <div style={{fontSize:52,marginBottom:12}}>🏠</div>
              <div style={{fontSize:18,fontWeight:700,fontFamily:"Playfair Display,Georgia,serif",color:"#FAF0E6",marginBottom:10}}>Nessun annuncio ancora</div>
              <p style={{maxWidth:340,margin:"0 auto 20px",lineHeight:1.6,fontSize:14}}>Vai su Ricerche, trova un appartamento e aggiungilo con ＋ Aggiungi.</p>
              <button onClick={goAdd} style={btn}>＋ Aggiungi il primo</button>
            </div>
          ):filtered.length===0?(
            <div style={{textAlign:"center",padding:"40px 20px",fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0"}}>
              <div style={{fontSize:36}}>🔎</div>
              <div style={{fontSize:17,fontWeight:700,fontFamily:"Playfair Display,Georgia,serif",color:"#FAF0E6",margin:"10px 0 6px"}}>Nessun risultato</div>
            </div>
          ):(
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
              {filtered.map(l=>{
                return (
                  <div key={l._id} style={{background:"#8B3214",borderRadius:12,padding:16,display:"flex",flexDirection:"column",gap:9,boxShadow:"0 2px 8px rgba(0,0,0,.2)"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:6}}>
                      <Badge fonte={l.fonte}/>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        {l.lat&&<span style={{fontSize:11,color:"#7EC87E"}} title="Geocodificato">📍</span>}
                        <CondBadge cond={l.condizioni}/>
                      </div>
                    </div>
                    <div style={{fontSize:14,fontWeight:600,lineHeight:1.4,fontFamily:"Playfair Display,Georgia,serif",color:"#FAF0E6"}}>{l.titolo||<em style={{color:"#E8C9A0",fontWeight:400,opacity:.6}}>Senza titolo</em>}</div>
                    {(l.zona||l.indirizzo)&&(
                      <div style={{fontSize:12,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0"}}>
                        <b>{l.zona}</b>{l.indirizzo&&<span style={{opacity:.7}}> · {l.indirizzo}</span>}
                      </div>
                    )}
                    <div style={{display:"flex",background:"#B5921B",borderRadius:8,overflow:"hidden"}}>
                      {[{v:fmt(l.prezzo),k:"Prezzo"},{v:fmtM(l.dimensione),k:"Superficie"},{v:l.vani?`${l.vani} vani`:"—",k:"Locali"}].map((s,j)=>(
                        <div key={j} style={{flex:1,padding:"8px 4px",textAlign:"center",borderLeft:j?"1px solid rgba(255,255,255,.3)":"none"}}>
                          <div style={{fontSize:12,fontWeight:700,fontFamily:"Courier Prime,Courier New,monospace",color:"#FAF0E6"}}>{s.v}</div>
                          <div style={{fontSize:9,fontFamily:"Courier Prime,Courier New,monospace",color:"#FAF0E6",opacity:.8,textTransform:"uppercase",letterSpacing:.5,marginTop:2}}>{s.k}</div>
                        </div>
                      ))}
                    </div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                      {l.piano&&<Chip>🏢 {l.piano}</Chip>}
                      {ppm(l.prezzo,l.dimensione)&&<Chip>{ppm(l.prezzo,l.dimensione)}</Chip>}
                      {l.terrazzo&&<Chip bg="#d1fae5" color="#065f46">🌿 Terrazzo</Chip>}
                      {l.box&&<Chip bg="#e0e7ff" color="#3730a3">🚗 Box</Chip>}
                      {l.cantina&&<Chip bg="#fef9c3" color="#713f12">📦 Cantina</Chip>}
                    </div>
                    {l.voto>0&&<div style={{fontSize:18,color:"#B5921B",letterSpacing:2}}>{"★".repeat(l.voto)}{"☆".repeat(5-l.voto)}</div>}
                    {l.note&&<div style={{fontSize:12,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",fontStyle:"italic",lineHeight:1.4}}>💬 {l.note}</div>}
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",borderTop:"1px solid rgba(255,255,255,.2)",paddingTop:10,marginTop:2}}>
                      {l.link?<a href={l.link} target="_blank" rel="noopener noreferrer" style={{fontSize:13,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",fontWeight:700,textDecoration:"none"}}>Vedi annuncio →</a>:<span/>}
                      <div style={{display:"flex",gap:6}}>
                        <button onClick={()=>startEdit(l)} style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:7,padding:"6px 10px",cursor:"pointer",fontSize:14}}>✏️</button>
                        <button onClick={()=>setConfirm(l._id)} style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:7,padding:"6px 10px",cursor:"pointer",fontSize:14}}>🗑</button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* TAB MAPPA */}
      {tab==="mappa"&&(
        listings.length===0?(
          <div style={{textAlign:"center",padding:"56px 20px",fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0"}}>
            <div style={{fontSize:52,marginBottom:12}}>🗺</div>
            <div style={{fontSize:18,fontWeight:700,fontFamily:"Playfair Display,Georgia,serif",color:"#FAF0E6",marginBottom:10}}>Nessun annuncio da mostrare</div>
            <p style={{maxWidth:340,margin:"0 auto 20px",lineHeight:1.6,fontSize:14}}>Aggiungi un annuncio con un indirizzo e apparirà qui sulla mappa.</p>
            <button onClick={goAdd} style={btn}>＋ Aggiungi il primo</button>
          </div>
        ):(
          <MapTab listings={listings}/>
        )
      )}

      {/* TAB AGGIUNGI */}
      {tab==="aggiungi"&&(
        <div style={{padding:"20px 16px 60px",maxWidth:680,margin:"0 auto"}}>
          <div style={{background:"#8B3214",borderRadius:12,padding:22}}>
            <h2 style={{fontSize:20,fontWeight:700,fontFamily:"Playfair Display,Georgia,serif",color:"#FAF0E6",margin:"0 0 4px"}}>{editId!==null?"✏️ Modifica":"＋ Nuovo annuncio"}</h2>
            <p style={{fontSize:13,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",margin:"0 0 20px",lineHeight:1.6}}>
              Incolla il <b>titolo dell'annuncio</b> nel campo qui sotto — l'indirizzo si compila da solo e l'annuncio apparirà sulla mappa dopo il salvataggio.
            </p>

            {/* Banner indirizzo auto-compilato */}
            {form.indirizzo && (
              <div style={{background:"rgba(181,146,27,.2)",border:"1px solid #B5921B",borderRadius:8,padding:"8px 14px",marginBottom:16,fontSize:13,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0"}}>
                📍 Indirizzo rilevato: <b style={{color:"#FAF0E6"}}>{form.indirizzo}</b>
                <span style={{opacity:.6,fontSize:11,marginLeft:6}}>(puoi modificarlo sotto)</span>
              </div>
            )}

            <div className="fg" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px 16px"}}>
              <FRow label="Titolo dell'annuncio (incolla dal sito)" span={2}>
                <input style={fi}
                  placeholder='es. "Bilocale in vendita in Piazzale Susa, 7"'
                  value={form.titolo}
                  onChange={e => onTitoloChange(e.target.value)}
                />
              </FRow>
              <FRow label="🔗 Link annuncio" span={2}>
                <input style={fi} placeholder="https://www.immobiliare.it/annunci/12345678/" value={form.link} onChange={e=>setForm(f=>({...f,link:e.target.value}))}/>
              </FRow>
              <FRow label="Fonte">
                <select style={fi} value={form.fonte} onChange={e=>setForm(f=>({...f,fonte:e.target.value}))}>
                  {SOURCES.map(s=><option key={s}>{s}</option>)}
                </select>
              </FRow>
              <FRow label="Zona">
                <select style={fi} value={form.zona} onChange={e=>setForm(f=>({...f,zona:e.target.value}))}>
                  <option value="">— seleziona —</option>
                  {ZONE.map(z=><option key={z}>{z}</option>)}
                </select>
              </FRow>
              <FRow label="Indirizzo (per la mappa)" span={2}>
                <input style={fi}
                  placeholder="Via Roma 12  (auto-compilato dal titolo)"
                  value={form.indirizzo}
                  onChange={e=>setForm(f=>({...f,indirizzo:e.target.value,lat:null,lng:null}))}
                />
              </FRow>
              <FRow label="Prezzo (€)">
                <input style={fi} type="number" inputMode="numeric" placeholder="380000" value={form.prezzo} onChange={e=>setForm(f=>({...f,prezzo:e.target.value}))}/>
              </FRow>
              <FRow label="Superficie (m²)">
                <input style={fi} type="number" inputMode="numeric" placeholder="85" value={form.dimensione} onChange={e=>setForm(f=>({...f,dimensione:e.target.value}))}/>
              </FRow>
              <FRow label="Vani">
                <input style={fi} type="number" inputMode="numeric" placeholder="3" value={form.vani} onChange={e=>setForm(f=>({...f,vani:e.target.value}))}/>
              </FRow>
              <FRow label="Piano">
                <input style={fi} placeholder="3° su 5" value={form.piano} onChange={e=>setForm(f=>({...f,piano:e.target.value}))}/>
              </FRow>
              <FRow label="Condizioni">
                <select style={fi} value={form.condizioni} onChange={e=>setForm(f=>({...f,condizioni:e.target.value}))}>
                  {Object.keys(COND).map(c=><option key={c}>{c}</option>)}
                </select>
              </FRow>
              <FRow label="Il tuo voto" span={2}>
                <div style={{display:"flex",gap:6}}>
                  {[1,2,3,4,5].map(n=>(
                    <button key={n} onClick={()=>setForm(f=>({...f,voto:n}))}
                      style={{fontSize:30,background:"none",border:"none",cursor:"pointer",opacity:form.voto>=n?1:.2,padding:0,color:"#f59e0b"}}>★</button>
                  ))}
                </div>
              </FRow>
              <FRow label="Extra" span={2}>
                <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
                  {[["terrazzo","🌿 Terrazzo"],["box","🚗 Box"],["cantina","📦 Cantina"]].map(([k,lbl])=>(
                    <label key={k} style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer",fontFamily:"Arial,sans-serif",fontSize:15}}>
                      <input type="checkbox" style={{width:18,height:18}} checked={!!form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.checked}))}/>
                      {lbl}
                    </label>
                  ))}
                </div>
              </FRow>
              <FRow label="Note personali" span={2}>
                <textarea style={{...fi,height:90,resize:"vertical"}} placeholder="Impressioni, pro/contro, cose da verificare..."
                  value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))}/>
              </FRow>
            </div>
            <div style={{display:"flex",gap:10,marginTop:22,flexWrap:"wrap"}}>
              <button onClick={saveForm} disabled={saving||geocoding}
                style={{...btn,background:(saving||geocoding)?"#9B3A17":"#B5921B",padding:"14px 28px",fontSize:16,borderRadius:10}}>
                {geocoding?"📍 Geocodifica in corso…":saving?"⏳ Salvataggio…":editId!==null?"💾 Salva modifiche":"✅ Aggiungi e vai alla mappa"}
              </button>
              <button onClick={()=>{setForm(EMPTY);setEditId(null);setTab("annunci");}} style={{...btn,background:"#9B3A17"}}>Annulla</button>
            </div>
          </div>
        </div>
      )}

      {/* MODALE ELIMINA */}
      {confirm!==null&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999,padding:20}}>
          <div style={{background:"#8B3214",borderRadius:16,padding:28,textAlign:"center",maxWidth:310,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,.4)"}}>
            <div style={{fontSize:36,marginBottom:8}}>🗑</div>
            <div style={{fontSize:17,fontWeight:700,fontFamily:"Playfair Display,Georgia,serif",color:"#FAF0E6",marginBottom:8}}>Eliminare questo annuncio?</div>
            <p style={{fontSize:13,fontFamily:"Courier Prime,Courier New,monospace",color:"#E8C9A0",margin:"0 0 20px"}}>L'operazione non è reversibile.</p>
            <div style={{display:"flex",gap:10,justifyContent:"center"}}>
              <button onClick={()=>delItem(confirm)} style={{...btn,background:"#7A1010"}}>Sì, elimina</button>
              <button onClick={()=>setConfirm(null)} style={{...btn,background:"#9B3A17"}}>Annulla</button>
            </div>
          </div>
        </div>
      )}
      <div style={{height:32}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
