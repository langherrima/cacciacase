<head>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyDghKWGnq2zMkKGUs8PheahA35yC-GGqYY",
  authDomain:"caccia-case.firebaseapp.com",
  projectId:"caccia-case",
  storageBucket:"caccia-case.firebasestorage.app",
  messagingSenderId:"775563837811",
  appId:"1:775563837811:web:8967d71ba7c2698f808506"
});
const _db=firebase.firestore();
const _col=_db.collection("annunci");
window.__db={
  subscribe:(cb)=>_col.onSnapshot(snap=>{cb(snap.docs.map(d=>({...d.data(),_id:d.id})));}),
  add:(data)=>_col.add({...data,_ts:firebase.firestore.FieldValue.serverTimestamp()}),
  update:(id,data)=>{const{_id,_ts,...rest}=data;return _col.doc(id).update(rest);},
  remove:(id)=>_col.doc(id).delete(),
};
window.__dbReady=true;
window.dispatchEvent(new Event("dbReady"));
</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#B5451B;font-family:'Courier Prime','Courier New',monospace;color:#FAF0E6;min-height:100vh}
input,select,textarea,button{font-family:inherit}
select option{color:#1a1a2e;background:#fff}
@media(max-width:500px){.fg{grid-template-columns:1fr !important}.fg>*{grid-column:span 1 !important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect,useRef} = React;

// ── DATI ─────────────────────────────────────────────────────────────────────
const SOURCES = ["Immobiliare.it","Idealista","Casa.it","Tecnocasa","Gabetti","Engel & Volkers","Privato","Altro"];
const COND    = {"Ottimo":"#16a34a","Buono":"#b45309","Da ristrutturare":"#dc2626"};
const ZONE    = ["Navigli","Isola / Garibaldi","Città Studi","Greco / Turro","Porta Vittoria",
                 "Porta Venezia","Porta Romana","Cadore","Susa","Nolo","Repubblica",
                 "Lorenteggio","Bicocca","Fiera / De Angeli","Vigentino","Centro Storico","Altra zona"];
const SEARCHES = [
  {nome:"Immobiliare.it",url:"https://www.immobiliare.it/vendita-appartamenti/milano/?prezzoMassimo=470000&superficieMinima=70&superficieMassima=100"},
  {nome:"Idealista",     url:"https://www.idealista.it/vendita-case/milano-milano/"},
  {nome:"Casa.it",       url:"https://www.casa.it/vendita/residenziale/milano/"},
  {nome:"Tecnocasa",     url:"https://www.tecnocasa.it/vendita/appartamento/lombardia/milano.html"},
  {nome:"Gabetti",       url:"https://www.gabetti.it/vendita/appartamento/milano"},
];
const SOCIALS = [
  {nome:"@carolachiusano",     f:"126K",url:"https://www.instagram.com/carolachiusano/",     note:"Milano · Torino · Parigi"},
  {nome:"@annabuono_",         f:"30K", url:"https://www.instagram.com/annabuono_/",         note:"Caseperfette · CityLife"},
  {nome:"@jacopotartaglia",    f:"17K", url:"https://www.instagram.com/jacopotartaglia/",    note:"Agente · mercato e prezzi"},
  {nome:"@elisabettacasabase", f:"—",   url:"https://www.instagram.com/elisabettacasabase/", note:"Torino · apre su Milano"},
  {nome:"RossoMattone",        f:"—",   url:"https://www.instagram.com/rossomattone.eu/",    note:"Agenzia milanese"},
];
const EMPTY = {titolo:"",zona:"",indirizzo:"",fonte:"Immobiliare.it",prezzo:"",
               dimensione:"",vani:"",piano:"",condizioni:"Buono",
               terrazzo:false,box:false,cantina:false,voto:3,note:"",link:""};

// ── UTILS ─────────────────────────────────────────────────────────────────────
const fmt  = p   => p ? "€ "+Number(p).toLocaleString("it-IT") : "—";
const fmtM = m   => m ? m+" m²" : "—";
const ppm  = (p,m)=> (p&&m) ? "€ "+Math.round(Number(p)/Number(m)).toLocaleString("it-IT")+"/m²" : "";

// ── MICRO COMPONENTI ──────────────────────────────────────────────────────────
function Badge({fonte}){
  return <span style={{fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20,background:"#B5921B",color:"#FAF0E6",display:"inline-block"}}>{fonte}</span>;
}
function CondBadge({cond}){
  const cc=COND[cond]||"#888";
  return <span style={{fontSize:10,border:"1.5px solid "+cc,color:cc,borderRadius:4,padding:"2px 7px",fontWeight:700}}>{cond}</span>;
}
function Chip({children,bg,co}){
  return <span style={{fontSize:11,background:bg||"#9B3A17",color:co||"#E8C9A0",borderRadius:4,padding:"3px 8px",whiteSpace:"nowrap"}}>{children}</span>;
}
function Sel({value,onChange,opts}){
  return (
    <select value={value} onChange={e=>onChange(e.target.value)}
      style={{border:"1px solid rgba(255,255,255,.3)",borderRadius:7,padding:"7px 10px",fontSize:13,background:"#9B3A17",outline:"none",minWidth:80,color:"#FAF0E6"}}>
      {opts.map(o=>typeof o==="string"
        ? <option key={o} value={o}>{o}</option>
        : <option key={o.v} value={o.v}>{o.l}</option>)}
    </select>
  );
}
function Stat({label,val}){
  return (
    <div style={{display:"flex",flexDirection:"column",gap:2}}>
      <div style={{fontSize:9,color:"#C4967A",textTransform:"uppercase",letterSpacing:1}}>{label}</div>
      <div style={{fontSize:15,fontWeight:700,color:"#FAF0E6"}}>{val}</div>
    </div>
  );
}
function FRow({label,children,span}){
  return (
    <div style={{gridColumn:"span "+(span||1),display:"flex",flexDirection:"column",gap:5}}>
      <label style={{fontSize:12,color:"#E8C9A0",fontWeight:600}}>{label}</label>
      {children}
    </div>
  );
}
const FI  = {border:"1px solid rgba(255,255,255,.3)",borderRadius:7,padding:"10px 12px",fontSize:15,outline:"none",background:"#9B3A17",width:"100%",boxSizing:"border-box",color:"#FAF0E6"};
const BTN = {background:"#B5921B",color:"#FAF0E6",border:"none",borderRadius:8,padding:"10px 18px",fontSize:14,fontWeight:700,cursor:"pointer"};

// ── MAPPA ─────────────────────────────────────────────────────────────────────
function MapView({listings,onGeocode}){
  const mapRef     = useRef(null);
  const mapInst    = useRef(null);
  const markers    = useRef([]);
  const [running,  setRunning]  = useState(false);
  const [done,     setDone]     = useState(0);
  const [total,    setTotal]    = useState(0);

  const CMAP = {"Ottimo":"#16a34a","Buono":"#B5921B","Da ristrutturare":"#dc2626"};

  function mkIcon(color){
    const html = '<div style="width:26px;height:26px;background:'+color+';border:3px solid #FAF0E6;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:11px">🏠</div>';
    return L.divIcon({className:"",html:html,iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-16]});
  }

  useEffect(()=>{
    if(!mapRef.current) return;
    if(!mapInst.current){
      mapInst.current = L.map(mapRef.current,{zoomControl:true}).setView([45.4654,9.1859],12);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:18}).addTo(mapInst.current);
    }
    markers.current.forEach(m=>m.remove());
    markers.current=[];
    listings.forEach(function(l){
      if(!l.lat||!l.lng) return;
      if(l.note&&l.note.trim().toUpperCase()==="NO") return;
      const color = CMAP[l.condizioni]||"#888";
      const stars = "★".repeat(l.voto||0)+"☆".repeat(5-(l.voto||0));
      const prezzo = l.prezzo ? "€ "+Number(l.prezzo).toLocaleString("it-IT") : "";
      const dim    = l.dimensione ? l.dimensione+" m²" : "";
      const link   = l.link ? '<a href="'+l.link+'" target="_blank" style="font-size:11px;color:#8B3214;font-weight:700">Vedi annuncio</a>' : "";
      const popup  = '<div style="min-width:180px">'
        +'<div style="font-family:serif;font-size:13px;font-weight:700;color:#3D1C0A;margin-bottom:3px">'+(l.titolo||"Annuncio")+'</div>'
        +'<div style="font-size:11px;color:#8B5E3C;margin-bottom:6px">'+( l.zona||"")+(l.indirizzo?" · "+l.indirizzo:"")+'</div>'
        +'<div style="display:flex;gap:6px;margin-bottom:5px">'
        +'<span style="background:#B5921B;color:#fff;font-size:10px;padding:2px 7px;border-radius:4px">'+prezzo+'</span>'
        +'<span style="background:#B5921B;color:#fff;font-size:10px;padding:2px 7px;border-radius:4px">'+dim+'</span>'
        +'</div>'
        +'<div style="font-size:14px;color:'+color+';margin-bottom:4px">'+stars+'</div>'
        +link+'</div>';
      const mk = L.marker([l.lat,l.lng],{icon:mkIcon(color)}).bindPopup(popup).addTo(mapInst.current);
      markers.current.push(mk);
    });
  },[listings]);

  const senzaCoords = listings.filter(function(l){return !l.lat&&(l.indirizzo||l.zona);});
  const conCoords   = listings.filter(function(l){return l.lat&&l.lng;}).length;

  function avviaGeocode(){
    if(!senzaCoords.length||running) return;
    setRunning(true);
    setTotal(senzaCoords.length);
    setDone(0);
    var i=0;
    function next(){
      if(i>=senzaCoords.length){setRunning(false);return;}
      onGeocode(senzaCoords[i],function(){setDone(i+1);i++;setTimeout(next,1200);});
    }
    next();
  }

  return (
    <div style={{borderRadius:10,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,.3)"}}>
      <div style={{background:"#8B3214",padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div>
          <div style={{fontFamily:"Playfair Display,serif",fontSize:15,fontWeight:700,color:"#FAF0E6"}}>Mappa annunci · Milano</div>
          <div style={{fontSize:10,color:"#E8C9A0",opacity:.7,textTransform:"uppercase",letterSpacing:1}}>{conCoords} di {listings.length} posizionati</div>
        </div>
        {senzaCoords.length>0 && (
          <button onClick={avviaGeocode} disabled={running}
            style={{background:"#B5921B",color:"#FAF0E6",border:"none",borderRadius:7,padding:"7px 12px",fontSize:12,fontWeight:700,cursor:running?"not-allowed":"pointer",opacity:running?0.7:1}}>
            {running ? ("📍 "+done+"/"+total+"…") : ("📍 Geocodifica tutti ("+senzaCoords.length+")")}
          </button>
        )}
      </div>
      <div ref={mapRef} style={{height:420,width:"100%"}}/>
      <div style={{background:"#8B3214",padding:"10px 14px",display:"flex",gap:20,flexWrap:"wrap",alignItems:"center"}}>
        {[["#16a34a","Ottimo"],["#B5921B","Buono"],["#dc2626","Da ristrutturare"]].map(function(pair){
          return (
            <div key={pair[1]} style={{display:"flex",alignItems:"center",gap:6}}>
              <div style={{width:12,height:12,borderRadius:"50%",background:pair[0],border:"2px solid #FAF0E6"}}/>
              <span style={{fontSize:11,color:"#E8C9A0"}}>{pair[1]}</span>
            </div>
          );
        })}
        {listings.length===0 && <span style={{fontSize:11,color:"#E8C9A0",opacity:.7}}>Aggiungi annunci per vederli sulla mappa</span>}
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [dbReady,  setDbReady]  = useState(!!window.__dbReady);
  const [listings, setListings] = useState([]);
  const [tab,      setTab]      = useState("ricerche");
  const [form,     setForm]     = useState(EMPTY);
  const [editId,   setEditId]   = useState(null);
  const [confirm,  setConfirm]  = useState(null);
  const [saving,   setSaving]   = useState(false);
  const [fZona,    setFZona]    = useState("Tutte");
  const [fFonte,   setFFonte]   = useState("Tutte");
  const [fCond,    setFCond]    = useState("Tutte");
  const [fSort,    setFSort]    = useState("data_desc");
  const [fQuery,   setFQuery]   = useState("");

  useEffect(function(){
    if(window.__dbReady){setDbReady(true);return;}
    var h=function(){setDbReady(true);};
    window.addEventListener("dbReady",h);
    return function(){window.removeEventListener("dbReady",h);};
  },[]);

  useEffect(function(){
    if(!dbReady) return;
    return window.__db.subscribe(function(docs){
      docs.sort(function(a,b){return (b._ts?b._ts.seconds:0)-(a._ts?a._ts.seconds:0);});
      setListings(docs);
    });
  },[dbReady]);

  function geocodeAddr(indirizzo,zona,cb){
    var q=(indirizzo||"")+" "+(zona||"")+" Milano Italy";
    fetch("https://nominatim.openstreetmap.org/search?format=json&q="+encodeURIComponent(q)+"&limit=1")
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.length){
          var lat=parseFloat(d[0].lat),lng=parseFloat(d[0].lon);
          cb&&cb(lat,lng);
        } else {cb&&cb(null,null);}
      })
      .catch(function(){cb&&cb(null,null);});
  }

  function handleGeocode(listing,done){
    geocodeAddr(listing.indirizzo,listing.zona,function(lat,lng){
      if(lat&&lng){
        var data=Object.assign({},listing,{lat:lat,lng:lng});
        window.__db.update(listing._id,data).then(done).catch(done);
      } else {done();}
    });
  }

  function saveForm(){
    if(!form.link&&!form.titolo) return;
    setSaving(true);
    var d=Object.assign({},form);
    delete d._id; delete d._ts;
    function doSave(){
      var p = editId!==null ? window.__db.update(editId,d) : window.__db.add(d);
      p.then(function(){setEditId(null);setForm(EMPTY);setTab("annunci");setSaving(false);})
       .catch(function(e){alert("Errore: "+e.message);setSaving(false);});
    }
    if((d.indirizzo||d.zona)&&!d.lat){
      geocodeAddr(d.indirizzo,d.zona,function(lat,lng){
        if(lat&&lng){d.lat=lat;d.lng=lng;}
        doSave();
      });
    } else {doSave();}
  }

  function startEdit(l){setForm(Object.assign({},l));setEditId(l._id);setTab("aggiungi");}
  function delItem(id){window.__db.remove(id).then(function(){setConfirm(null);});}

  var filtered = useMemo(function(){
    var r=listings.filter(function(l){
      if(fZona!=="Tutte"&&l.zona!==fZona)return false;
      if(fFonte!=="Tutte"&&l.fonte!==fFonte)return false;
      if(fCond!=="Tutte"&&l.condizioni!==fCond)return false;
      if(fQuery){
        var q=fQuery.toLowerCase();
        if(![l.titolo,l.zona,l.indirizzo,l.note,l.fonte].some(function(s){return s&&s.toLowerCase().indexOf(q)>=0;}))return false;
      }
      return true;
    });
    r.sort(function(a,b){
      var aNO=a.note&&a.note.trim().toUpperCase()==="NO";
      var bNO=b.note&&b.note.trim().toUpperCase()==="NO";
      if(aNO&&!bNO) return 1;
      if(!aNO&&bNO) return -1;
      if(fSort==="prezzo_asc")  return (Number(a.prezzo)||Infinity)-(Number(b.prezzo)||Infinity);
      if(fSort==="prezzo_desc") return (Number(b.prezzo)||0)-(Number(a.prezzo)||0);
      if(fSort==="mq_desc")     return (Number(b.dimensione)||0)-(Number(a.dimensione)||0);
      if(fSort==="voto_desc")   return (Number(b.voto)||0)-(Number(a.voto)||0);
      if(fSort==="ppm")         return (a.prezzo/a.dimensione||Infinity)-(b.prezzo/b.dimensione||Infinity);
      return 0;
    });
    return r;
  },[listings,fZona,fFonte,fCond,fSort,fQuery]);

  var withP  = filtered.filter(function(l){return Number(l.prezzo)>0;});
  var withPM = filtered.filter(function(l){return Number(l.prezzo)>0&&Number(l.dimensione)>0;});
  var stats  = {
    tot:  filtered.length,
    minP: withP.length  ? Math.min.apply(null,withP.map(function(l){return Number(l.prezzo);})) : 0,
    avgP: withP.length  ? Math.round(withP.reduce(function(s,l){return s+Number(l.prezzo);},0)/withP.length) : 0,
    avgPM:withPM.length ? Math.round(withPM.reduce(function(s,l){return s+l.prezzo/l.dimensione;},0)/withPM.length) : 0,
  };

  if(!dbReady) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#8B3214",color:"#E8C9A0",fontSize:22,flexDirection:"column",gap:12}}>
      <div>🏠</div><div>Connessione in corso…</div>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:"#B5451B"}}>

      {/* HEADER */}
      <div style={{background:"#8B3214",padding:"env(safe-area-inset-top,16px) 18px 0",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(0,0,0,.35)"}}>
        <div style={{paddingTop:8}}>
          <div style={{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#E8C9A0"}}>🏙 Monitor Immobiliare · Milano</div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <h1 style={{fontSize:26,fontWeight:700,color:"#FAF0E6",letterSpacing:-1,margin:"2px 0 10px",fontFamily:"Playfair Display,serif"}}>Caccia Casa</h1>
            <div style={{fontSize:10,color:"#7EC87E"}}>● live</div>
          </div>
        </div>
        <nav style={{display:"flex"}}>
          {[
            {id:"ricerche",icon:"🔗",label:"Ricerche"},
            {id:"annunci", icon:"📋",label:"Annunci ("+listings.length+")"},
            {id:"mappa",   icon:"🗺", label:"Mappa"},
            {id:"aggiungi",icon:editId!==null?"✏️":"＋",label:editId!==null?"Modifica":"Aggiungi"},
          ].map(function(t){return (
            <button key={t.id}
              onClick={function(){if(t.id==="aggiungi"&&editId===null)setForm(EMPTY);setTab(t.id);}}
              style={{background:"transparent",border:"none",borderBottom:"3px solid "+(tab===t.id?"#E8C9A0":"transparent"),padding:"10px 14px",fontSize:12,color:tab===t.id?"#E8C9A0":"#C4967A",cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
              <span style={{fontSize:15}}>{t.icon}</span>{t.label}
            </button>
          );})}
        </nav>
      </div>

      {/* TAB RICERCHE */}
      {tab==="ricerche" && (
        <div style={{padding:"20px 16px 40px",maxWidth:760,margin:"0 auto"}}>
          <div style={{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#E8C9A0",marginBottom:12,opacity:.7}}>🏢 Piattaforme e agenzie immobiliari</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:10}}>
            {SEARCHES.map(function(s){return (
              <a key={s.nome} href={s.url} target="_blank" rel="noopener noreferrer"
                 style={{background:"#8B3214",borderRadius:10,padding:14,borderLeft:"4px solid #B5921B",display:"flex",flexDirection:"column",gap:6,textDecoration:"none",color:"inherit",boxShadow:"0 2px 6px rgba(0,0,0,.2)"}}>
                <Badge fonte={s.nome}/>
                <div style={{fontSize:14,fontWeight:700,fontFamily:"Playfair Display,serif",color:"#FAF0E6"}}>Cerca su {s.nome}</div>
                <div style={{fontSize:10,color:"#E8C9A0",opacity:.7}}>{s.url.replace("https://","").slice(0,44)}…</div>
                <div style={{background:"#B5921B",color:"#FAF0E6",borderRadius:6,padding:"6px 12px",fontSize:12,fontWeight:700,alignSelf:"flex-start"}}>Apri →</div>
              </a>
            );})}
          </div>
          <div style={{height:1,background:"rgba(255,255,255,.15)",margin:"22px 0"}}/>
          <div style={{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#E8C9A0",marginBottom:12,opacity:.7}}>📸 Profili Instagram da monitorare</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:10}}>
            {SOCIALS.map(function(s){return (
              <a key={s.nome} href={s.url} target="_blank" rel="noopener noreferrer"
                 style={{background:"#8B3214",borderRadius:10,padding:14,borderLeft:"4px solid #B5921B",display:"flex",flexDirection:"column",gap:6,textDecoration:"none",color:"inherit",boxShadow:"0 2px 6px rgba(0,0,0,.2)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20,background:"#B5921B",color:"#FAF0E6"}}>📸 Instagram</span>
                  {s.f!=="—" && <span style={{fontSize:10,color:"#E8C9A0",opacity:.7}}>{s.f}</span>}
                </div>
                <div style={{fontSize:13,fontWeight:700,fontFamily:"Playfair Display,serif",color:"#FAF0E6"}}>{s.nome}</div>
                <div style={{fontSize:11,color:"#E8C9A0",opacity:.7,lineHeight:1.4}}>{s.note}</div>
                <div style={{fontSize:11,color:"#B5921B",fontWeight:700}}>Apri e attiva 🔔 →</div>
              </a>
            );})}
          </div>
          <div style={{marginTop:28,background:"#8B3214",borderRadius:12,padding:20}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:8,color:"#E8C9A0"}}>📱 Aggiungi alla Home dell'iPhone</div>
            <div style={{fontSize:13,lineHeight:1.8,color:"#E8C9A0"}}>
              1. Apri in <b style={{color:"#FAF0E6"}}>Safari</b><br/>
              2. Tocca <b style={{color:"#FAF0E6"}}>Condividi</b> (↑)<br/>
              3. Tocca <b style={{color:"#FAF0E6"}}>"Aggiungi alla schermata Home"</b>
            </div>
          </div>
        </div>
      )}

      {/* TAB MAPPA */}
      {tab==="mappa" && (
        <div style={{padding:"16px 16px 40px",maxWidth:760,margin:"0 auto"}}>
          <MapView listings={listings} onGeocode={handleGeocode}/>
        </div>
      )}

      {/* TAB ANNUNCI */}
      {tab==="annunci" && (
        <div style={{padding:"16px 16px 40px",maxWidth:760,margin:"0 auto"}}>
          <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:12,alignItems:"center"}}>
            <input style={Object.assign({},FI,{flex:2,minWidth:120,padding:"7px 10px",fontSize:13})} placeholder="🔍 Cerca..." value={fQuery} onChange={function(e){setFQuery(e.target.value);}}/>
            <Sel value={fZona}  onChange={setFZona}  opts={["Tutte"].concat(ZONE)}/>
            <Sel value={fFonte} onChange={setFFonte} opts={["Tutte"].concat(SOURCES)}/>
            <Sel value={fCond}  onChange={setFCond}  opts={["Tutte"].concat(Object.keys(COND))}/>
            <Sel value={fSort}  onChange={setFSort}  opts={[{v:"data_desc",l:"Recenti"},{v:"prezzo_asc",l:"Prezzo ↑"},{v:"prezzo_desc",l:"Prezzo ↓"},{v:"ppm",l:"€/m² ↑"},{v:"voto_desc",l:"Voto ↓"},{v:"mq_desc",l:"m² ↓"}]}/>
            <button onClick={function(){setForm(EMPTY);setEditId(null);setTab("aggiungi");}} style={Object.assign({},BTN,{padding:"7px 16px",fontSize:20,lineHeight:1})}>＋</button>
          </div>
          {listings.length>0 && (
            <div style={{display:"flex",gap:18,background:"#9B3A17",borderRadius:10,padding:"11px 16px",marginBottom:14,flexWrap:"wrap"}}>
              <Stat label="Filtrati"   val={stats.tot}/>
              <Stat label="Prezzo min" val={stats.minP?fmt(stats.minP):"—"}/>
              <Stat label="Media"      val={stats.avgP?fmt(stats.avgP):"—"}/>
              <Stat label="€/m² medio" val={stats.avgPM?"€ "+stats.avgPM.toLocaleString("it-IT")+"/m²":"—"}/>
            </div>
          )}
          {listings.length===0 ? (
            <div style={{textAlign:"center",padding:"56px 20px",color:"#E8C9A0"}}>
              <div style={{fontSize:52,marginBottom:12}}>🏠</div>
              <div style={{fontSize:18,fontWeight:700,fontFamily:"Playfair Display,serif",color:"#FAF0E6",marginBottom:10}}>Nessun annuncio ancora</div>
              <p style={{maxWidth:340,margin:"0 auto 20px",lineHeight:1.6,fontSize:14}}>Vai su Ricerche, trova un appartamento e aggiungilo.</p>
              <button onClick={function(){setForm(EMPTY);setEditId(null);setTab("aggiungi");}} style={BTN}>＋ Aggiungi il primo</button>
            </div>
          ) : filtered.length===0 ? (
            <div style={{textAlign:"center",padding:"40px 20px",color:"#E8C9A0"}}>
              <div style={{fontSize:36}}>🔎</div>
              <div style={{fontSize:17,fontWeight:700,fontFamily:"Playfair Display,serif",color:"#FAF0E6",margin:"10px 0 6px"}}>Nessun risultato</div>
            </div>
          ) : (
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
              {filtered.map(function(l){
                var cc=COND[l.condizioni]||"#888";
                return (
                  <div key={l._id} style={{background:"#8B3214",borderRadius:12,padding:16,display:"flex",flexDirection:"column",gap:9,boxShadow:"0 2px 8px rgba(0,0,0,.2)"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:6}}>
                      <Badge fonte={l.fonte}/>
                      <CondBadge cond={l.condizioni}/>
                    </div>
                    <div style={{fontSize:14,fontWeight:600,lineHeight:1.4,fontFamily:"Playfair Display,serif",color:"#FAF0E6"}}>{l.titolo||<em style={{color:"#E8C9A0",fontWeight:400}}>Senza titolo</em>}</div>
                    {(l.zona||l.indirizzo) && (
                      <div style={{fontSize:12,color:"#E8C9A0"}}>📍 <b>{l.zona}</b>{l.indirizzo&&<span style={{opacity:.7}}> · {l.indirizzo}</span>}</div>
                    )}
                    <div style={{display:"flex",background:"#B5921B",borderRadius:8,overflow:"hidden"}}>
                      {[{v:fmt(l.prezzo),k:"Prezzo"},{v:fmtM(l.dimensione),k:"Superficie"},{v:l.vani?l.vani+" vani":"—",k:"Locali"}].map(function(s,j){return (
                        <div key={j} style={{flex:1,padding:"8px 4px",textAlign:"center",borderLeft:j?"1px solid rgba(255,255,255,.3)":"none"}}>
                          <div style={{fontSize:12,fontWeight:700,color:"#FAF0E6"}}>{s.v}</div>
                          <div style={{fontSize:9,color:"#FAF0E6",opacity:.8,textTransform:"uppercase",letterSpacing:.5,marginTop:2}}>{s.k}</div>
                        </div>
                      );})}
                    </div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                      {l.piano    && <Chip>🏢 {l.piano}</Chip>}
                      {ppm(l.prezzo,l.dimensione) && <Chip>{ppm(l.prezzo,l.dimensione)}</Chip>}
                      {l.terrazzo && <Chip bg="#d1fae5" co="#065f46">🌿 Terrazzo</Chip>}
                      {l.box      && <Chip bg="#e0e7ff" co="#3730a3">🚗 Box</Chip>}
                      {l.cantina  && <Chip bg="#fef9c3" co="#713f12">📦 Cantina</Chip>}
                    </div>
                    {l.voto>0 && <div style={{fontSize:18,color:"#B5921B",letterSpacing:2}}>{"★".repeat(l.voto)}{"☆".repeat(5-l.voto)}</div>}
                    {l.note && <div style={{fontSize:12,color:"#E8C9A0",fontStyle:"italic",lineHeight:1.4}}>💬 {l.note}</div>}
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",borderTop:"1px solid rgba(255,255,255,.2)",paddingTop:10,marginTop:2}}>
                      {l.link ? <a href={l.link} target="_blank" rel="noopener noreferrer" style={{fontSize:13,color:"#E8C9A0",fontWeight:700,textDecoration:"none"}}>Vedi annuncio →</a> : <span/>}
                      <div style={{display:"flex",gap:6}}>
                        <button onClick={function(){startEdit(l);}} style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:7,padding:"6px 10px",cursor:"pointer",fontSize:14}}>✏️</button>
                        <button onClick={function(){setConfirm(l._id);}} style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:7,padding:"6px 10px",cursor:"pointer",fontSize:14}}>🗑</button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* TAB AGGIUNGI */}
      {tab==="aggiungi" && (
        <div style={{padding:"20px 16px 60px",maxWidth:680,margin:"0 auto"}}>
          <div style={{background:"#8B3214",borderRadius:12,padding:22}}>
            <h2 style={{fontSize:20,fontWeight:700,fontFamily:"Playfair Display,serif",color:"#FAF0E6",margin:"0 0 4px"}}>{editId!==null?"✏️ Modifica":"＋ Nuovo annuncio"}</h2>
            <p style={{fontSize:13,color:"#E8C9A0",margin:"0 0 20px",lineHeight:1.6}}>Incolla il link. Gli altri campi sono facoltativi.</p>
            <div className="fg" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px 16px"}}>
              <FRow label="🔗 Link annuncio" span={2}>
                <input style={FI} placeholder="https://www.immobiliare.it/annunci/..." value={form.link} onChange={function(e){setForm(function(f){return Object.assign({},f,{link:e.target.value});});}}/>
              </FRow>
              <FRow label="Titolo">
                <input style={FI} placeholder="es. Trilocale con terrazzo" value={form.titolo} onChange={function(e){setForm(function(f){return Object.assign({},f,{titolo:e.target.value});});}}/>
              </FRow>
              <FRow label="Fonte">
                <select style={FI} value={form.fonte} onChange={function(e){setForm(function(f){return Object.assign({},f,{fonte:e.target.value});});}}>
                  {SOURCES.map(function(s){return <option key={s}>{s}</option>;})}
                </select>
              </FRow>
              <FRow label="Zona">
                <select style={FI} value={form.zona} onChange={function(e){setForm(function(f){return Object.assign({},f,{zona:e.target.value});});}}>
                  <option value="">— seleziona —</option>
                  {ZONE.map(function(z){return <option key={z}>{z}</option>;})}
                </select>
              </FRow>
              <FRow label="Indirizzo">
                <input style={FI} placeholder="Via Roma 12" value={form.indirizzo} onChange={function(e){setForm(function(f){return Object.assign({},f,{indirizzo:e.target.value});});}}/>
              </FRow>
              <FRow label="Prezzo (€)">
                <input style={FI} type="number" inputMode="numeric" placeholder="380000" value={form.prezzo} onChange={function(e){setForm(function(f){return Object.assign({},f,{prezzo:e.target.value});});}}/>
              </FRow>
              <FRow label="Superficie (m²)">
                <input style={FI} type="number" inputMode="numeric" placeholder="85" value={form.dimensione} onChange={function(e){setForm(function(f){return Object.assign({},f,{dimensione:e.target.value});});}}/>
              </FRow>
              <FRow label="Vani">
                <input style={FI} type="number" inputMode="numeric" placeholder="3" value={form.vani} onChange={function(e){setForm(function(f){return Object.assign({},f,{vani:e.target.value});});}}/>
              </FRow>
              <FRow label="Piano">
                <input style={FI} placeholder="3° su 5" value={form.piano} onChange={function(e){setForm(function(f){return Object.assign({},f,{piano:e.target.value});});}}/>
              </FRow>
              <FRow label="Condizioni">
                <select style={FI} value={form.condizioni} onChange={function(e){setForm(function(f){return Object.assign({},f,{condizioni:e.target.value});});}}>
                  {Object.keys(COND).map(function(c){return <option key={c}>{c}</option>;})}
                </select>
              </FRow>
              <FRow label="Il tuo voto" span={2}>
                <div style={{display:"flex",gap:6}}>
                  {[1,2,3,4,5].map(function(n){return (
                    <button key={n} onClick={function(){setForm(function(f){return Object.assign({},f,{voto:n});});}}
                      style={{fontSize:30,background:"none",border:"none",cursor:"pointer",opacity:form.voto>=n?1:0.2,padding:0,color:"#f59e0b"}}>★</button>
                  );})}
                </div>
              </FRow>
              <FRow label="Extra" span={2}>
                <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
                  {[["terrazzo","🌿 Terrazzo"],["box","🚗 Box"],["cantina","📦 Cantina"]].map(function(pair){return (
                    <label key={pair[0]} style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer",fontSize:15}}>
                      <input type="checkbox" style={{width:18,height:18}} checked={!!form[pair[0]]} onChange={function(e){var k=pair[0];setForm(function(f){return Object.assign({},f,{[k]:e.target.checked});});}}/>
                      {pair[1]}
                    </label>
                  );})}
                </div>
              </FRow>
              <FRow label="Note personali" span={2}>
                <textarea style={Object.assign({},FI,{height:90,resize:"vertical"})} placeholder="Impressioni, pro/contro..."
                  value={form.note} onChange={function(e){setForm(function(f){return Object.assign({},f,{note:e.target.value});});}}/>
              </FRow>
            </div>
            <div style={{display:"flex",gap:10,marginTop:22,flexWrap:"wrap"}}>
              <button onClick={saveForm} disabled={saving}
                style={Object.assign({},BTN,{background:saving?"#9B3A17":"#B5921B",padding:"14px 28px",fontSize:16,borderRadius:10})}>
                {saving ? "⏳ Salvataggio…" : editId!==null ? "💾 Salva modifiche" : "✅ Aggiungi annuncio"}
              </button>
              <button onClick={function(){setForm(EMPTY);setEditId(null);setTab("annunci");}} style={Object.assign({},BTN,{background:"#9B3A17"})}>Annulla</button>
            </div>
          </div>
        </div>
      )}

      {/* MODALE ELIMINA */}
      {confirm!==null && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999,padding:20}}>
          <div style={{background:"#8B3214",borderRadius:16,padding:28,textAlign:"center",maxWidth:310,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,.4)"}}>
            <div style={{fontSize:36,marginBottom:8}}>🗑</div>
            <div style={{fontSize:17,fontWeight:700,fontFamily:"Playfair Display,serif",color:"#FAF0E6",marginBottom:8}}>Eliminare questo annuncio?</div>
            <p style={{fontSize:13,color:"#E8C9A0",margin:"0 0 20px"}}>Operazione non reversibile.</p>
            <div style={{display:"flex",gap:10,justifyContent:"center"}}>
              <button onClick={function(){delItem(confirm);}} style={Object.assign({},BTN,{background:"#7A1010"})}>Sì, elimina</button>
              <button onClick={function(){setConfirm(null);}} style={Object.assign({},BTN,{background:"#9B3A17"})}>Annulla</button>
            </div>
          </div>
        </div>
      )}
      <div style={{height:32}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
